# spark-queue/portable/manifests/spark-job-admission-policy.yaml
#
# Two ValidatingAdmissionPolicies, enforcing what the queue actually
# needs, not just convention:
#
# 1. spark-job-queue-policy — matches any Job in a team namespace that
#    either uses the configured Spark image (checked against both the
#    `repo:tag` and `repo@digest` forms, and against any registry prefix
#    — e.g. `docker.io/apache/spark:...` — not just an exact string
#    match) or carries the `queue: spark` label. A Job matched either way
#    must have `spec.suspend: true`, the `queue: spark` label, and
#    `spec.activeDeadlineSeconds` set — covers the official Spark image
#    under any reference form, and separately covers a team's own
#    differently-named image built from Spark via the label (which can't
#    be detected from the image string, so it depends on the label being
#    applied — team-spark-job-template.yaml already does).
#    Matches both CREATE and UPDATE, and only the queue controller's own
#    ServiceAccount may change `spec.suspend` or the `queue` label once a
#    matched Job exists — `edit` RBAC alone can still `kubectl patch` or
#    relabel an existing Job, but this policy rejects that patch unless
#    it comes from the controller itself.
#
# 2. spark-bare-pod-policy — Pods can't be "queued" the way Jobs are
#    (no `suspend` field, they run the instant they're created), so a
#    bare Pod is matched by image only (no label to check for an
#    ownerless pod). Denies any Pod using the Spark image with no
#    ownerReferences at all — catches a student's own bare
#    Pod (no owner) and `--deploy-mode cluster`'s externally-spawned
#    driver Pod (Spark's own client creates it directly, no Kubernetes
#    controller sets an owner back to anything) with the same rule, so
#    cluster mode ends up unsupported as a side effect, not a special
#    case. Legitimate client-mode executors stay allowed — Spark's own
#    k8s backend sets their owner to the driver Pod (the Job template's
#    own already-admitted pod), a real, non-empty ownerReference.
#
# `MutatingAdmissionPolicy` (which could silently fix a non-compliant
# submission) is not available on this cluster — confirmed directly
# (`kubectl api-resources` has no `mutatingadmissionpolicy`; it's alpha/
# beta and not enabled by default here, and may not be enabled on every
# cluster this repo targets either). `ValidatingAdmissionPolicy` is GA
# and always available, so both policies reject a non-compliant
# submission outright instead — arguably a better fit anyway: it forces
# the actual template to be used rather than silently rewriting what a
# student submitted.
#
# Usage:
#   SPARK_IMAGE_REPO="${SPARK_IMAGE%:*}" \
#   envsubst '${SPARK_IMAGE_REPO} ${INFRA_NAMESPACE}' \
#   < spark-queue/portable/manifests/spark-job-admission-policy.yaml | kubectl apply -f -
#
# Required vars: SPARK_IMAGE_REPO (used by both policies — must match
# exactly what team-spark-job-template.yaml is filled in with),
# INFRA_NAMESPACE (builds the controller's full ServiceAccount identity,
# e.g. system:serviceaccount:infra:spark-queue-controller)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: spark-job-queue-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  matchConditions:
    - name: spark-image-or-label-jobs
      expression: >-
        object.spec.template.spec.containers.exists(c,
          c.image.contains('${SPARK_IMAGE_REPO}:') || c.image.contains('${SPARK_IMAGE_REPO}@')
        ) ||
        (has(object.metadata.labels) && 'queue' in object.metadata.labels && object.metadata.labels['queue'] == 'spark') ||
        (request.operation == 'UPDATE' && has(oldObject.metadata.labels) && 'queue' in oldObject.metadata.labels && oldObject.metadata.labels['queue'] == 'spark')
  validations:
    - expression: "request.operation != 'CREATE' || object.spec.suspend == true"
      message: >-
        Spark Jobs must be submitted via spark-queue/portable/manifests/team-spark-job-template.yaml,
        which sets spec.suspend: true so the queue controller can admit it
        when a cluster-wide slot is free.
    - expression: >-
        request.operation != 'CREATE' ||
        (has(object.metadata.labels) && 'queue' in object.metadata.labels && object.metadata.labels['queue'] == 'spark')
      message: >-
        Spark Jobs must carry the 'queue: spark' label — use
        spark-queue/portable/manifests/team-spark-job-template.yaml.
    - expression: "has(object.spec.activeDeadlineSeconds) && object.spec.activeDeadlineSeconds > 0"
      message: >-
        Spark Jobs must set spec.activeDeadlineSeconds (team-spark-job-template.yaml
        already does) — otherwise an abandoned job can hold its cluster-wide
        slot forever.
    - expression: >-
        request.operation != 'UPDATE' ||
        request.userInfo.username == 'system:serviceaccount:${INFRA_NAMESPACE}:spark-queue-controller' ||
        (object.spec.suspend == oldObject.spec.suspend &&
         (has(object.metadata.labels) && 'queue' in object.metadata.labels ? object.metadata.labels['queue'] : '') ==
         (has(oldObject.metadata.labels) && 'queue' in oldObject.metadata.labels ? oldObject.metadata.labels['queue'] : ''))
      message: >-
        Only the queue controller may change spec.suspend or the queue
        label after a Spark Job is created.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: spark-job-queue-policy-binding
spec:
  policyName: spark-job-queue-policy
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: team
          operator: Exists
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: spark-bare-pod-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: uses-spark-image
      expression: >-
        object.spec.containers.exists(c,
          c.image.contains('${SPARK_IMAGE_REPO}:') || c.image.contains('${SPARK_IMAGE_REPO}@')
        )
  validations:
    - expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() > 0"
      message: >-
        Bare Pods using the Spark image aren't allowed in team namespaces —
        submit via spark-queue/portable/manifests/team-spark-job-template.yaml.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: spark-bare-pod-policy-binding
spec:
  policyName: spark-bare-pod-policy
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: team
          operator: Exists
