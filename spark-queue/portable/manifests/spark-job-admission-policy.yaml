# spark-queue/portable/manifests/spark-job-admission-policy.yaml
#
# Two ValidatingAdmissionPolicies, enforcing what the queue actually
# needs, not just convention:
#
# 1. spark-job-queue-policy — matches any Job in a team namespace that
#    either uses the configured Spark image (checked against both the
#    `repo:tag` and `repo@digest` forms, and against any registry prefix
#    — e.g. `docker.io/apache/spark:...` — not just an exact string
#    match) or carries the `queue: spark` label. A Job matched either way
#    must have `spec.suspend: true`, the `queue: spark` label, and
#    `spec.activeDeadlineSeconds` set to between 1 and 7200 — covers the
#    official Spark image under any reference form, and separately covers
#    a team's own differently-named image built from Spark via the label
#    (which can't be detected from the image string, so it depends on the
#    label being applied — team-spark-job-template.yaml already does).
#    Also caps `spec.parallelism` at 1 (a single Job can't claim more than
#    one slot's worth of resources via concurrent pods) and
#    `spec.ttlSecondsAfterFinished` at 86400 (one day — keeps finished
#    Jobs from accumulating indefinitely now that there's no per-team
#    Job-count quota).
#    Matches both CREATE and UPDATE, and only the queue controller's own
#    ServiceAccount may change `spec.suspend` or the `queue` label once a
#    matched Job exists — `edit` RBAC alone can still `kubectl patch` or
#    relabel an existing Job, but this policy rejects that patch unless
#    it comes from the controller itself. The activeDeadlineSeconds,
#    parallelism, and ttlSecondsAfterFinished caps apply identity-agnostic
#    on both CREATE and UPDATE — including to the controller's own
#    stuck-job force-termination patch (activeDeadlineSeconds: 1), which
#    stays comfortably inside the cap, so no identity exemption is needed
#    there the way it is for suspend/the label.
#
# 2. spark-bare-pod-policy — Pods can't be "queued" the way Jobs are
#    (no `suspend` field, they run the instant they're created), so this
#    denies any Pod with no ownerReferences at all in a team namespace,
#    regardless of image — not matched by image name. Matching by image
#    name alone would miss a custom-built image (e.g. `FROM apache/spark`
#    published under a different name), so this doesn't try to recognize
#    Spark at all: every legitimate Pod in a team namespace already has
#    an owner (Kafka via the Strimzi operator, Spark Jobs via
#    team-spark-job-template.yaml), so a bare Pod has no legitimate
#    reason to exist there no matter what it runs. Catches a student's
#    own bare Pod (no owner) and `--deploy-mode cluster`'s externally-
#    spawned driver Pod (Spark's own client creates it directly, no
#    Kubernetes controller sets an owner back to anything) with the same
#    rule, so cluster mode ends up unsupported as a side effect, not a
#    special case. Legitimate client-mode executors stay allowed —
#    Spark's own k8s backend sets their owner to the driver Pod (the Job
#    template's own already-admitted pod), a real, non-empty
#    ownerReference.
#
# `MutatingAdmissionPolicy` (which could silently fix a non-compliant
# submission) is not available on this cluster — confirmed directly
# (`kubectl api-resources` has no `mutatingadmissionpolicy`; it's alpha/
# beta and not enabled by default here, and may not be enabled on every
# cluster this repo targets either). `ValidatingAdmissionPolicy` is GA
# and always available, so both policies reject a non-compliant
# submission outright instead — arguably a better fit anyway: it forces
# the actual template to be used rather than silently rewriting what a
# student submitted.
#
# Usage:
#   SPARK_IMAGE_REPO="${SPARK_IMAGE%%@*}" \
#   envsubst '${SPARK_IMAGE_REPO} ${INFRA_NAMESPACE}' \
#   < spark-queue/portable/manifests/spark-job-admission-policy.yaml | kubectl apply -f -
#
# Required vars: SPARK_IMAGE_REPO (used by spark-job-queue-policy only —
# must match exactly what team-spark-job-template.yaml is filled in with),
# INFRA_NAMESPACE (builds the controller's full ServiceAccount identity,
# e.g. system:serviceaccount:infra:spark-queue-controller)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: spark-job-queue-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  matchConditions:
    - name: spark-image-or-label-jobs
      expression: >-
        object.spec.template.spec.containers.exists(c,
          c.image.contains('${SPARK_IMAGE_REPO}:') || c.image.contains('${SPARK_IMAGE_REPO}@')
        ) ||
        (has(object.metadata.labels) && 'queue' in object.metadata.labels && object.metadata.labels['queue'] == 'spark') ||
        (request.operation == 'UPDATE' && has(oldObject.metadata.labels) && 'queue' in oldObject.metadata.labels && oldObject.metadata.labels['queue'] == 'spark')
  validations:
    - expression: "request.operation != 'CREATE' || object.spec.suspend == true"
      message: >-
        Spark Jobs must be submitted via spark-queue/portable/manifests/team-spark-job-template.yaml,
        which sets spec.suspend: true so the queue controller can admit it
        when a cluster-wide slot is free.
    - expression: >-
        request.operation != 'CREATE' ||
        (has(object.metadata.labels) && 'queue' in object.metadata.labels && object.metadata.labels['queue'] == 'spark')
      message: >-
        Spark Jobs must carry the 'queue: spark' label — use
        spark-queue/portable/manifests/team-spark-job-template.yaml.
    - expression: >-
        has(object.spec.activeDeadlineSeconds) &&
        object.spec.activeDeadlineSeconds > 0 &&
        object.spec.activeDeadlineSeconds <= 7200
      message: >-
        Spark Jobs must set spec.activeDeadlineSeconds between 1 and 7200
        (team-spark-job-template.yaml already does) — otherwise an abandoned
        job can hold its cluster-wide slot forever, or a job can claim more
        runtime than the template allows.
    - expression: "!has(object.spec.parallelism) || object.spec.parallelism <= 1"
      message: >-
        Spark Jobs must not set spec.parallelism above 1 — a single Job
        spinning up multiple pods at once would claim more than one
        cluster-wide slot's worth of resources while still counting as a
        single queued job.
    - expression: >-
        !has(object.spec.ttlSecondsAfterFinished) ||
        object.spec.ttlSecondsAfterFinished <= 86400
      message: >-
        Spark Jobs must not set spec.ttlSecondsAfterFinished above 86400
        (one day) — otherwise finished Jobs can accumulate in a team
        namespace indefinitely, now that there's no longer a per-team
        Job-count quota.
    - expression: >-
        request.operation != 'UPDATE' ||
        request.userInfo.username == 'system:serviceaccount:${INFRA_NAMESPACE}:spark-queue-controller' ||
        (object.spec.suspend == oldObject.spec.suspend &&
         (has(object.metadata.labels) && 'queue' in object.metadata.labels ? object.metadata.labels['queue'] : '') ==
         (has(oldObject.metadata.labels) && 'queue' in oldObject.metadata.labels ? oldObject.metadata.labels['queue'] : ''))
      message: >-
        Only the queue controller may change spec.suspend or the queue
        label after a Spark Job is created.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: spark-job-queue-policy-binding
spec:
  policyName: spark-job-queue-policy
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: team
          operator: Exists
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: spark-bare-pod-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() > 0"
      message: >-
        Bare Pods aren't allowed in team namespaces — submit Spark jobs via
        spark-queue/portable/manifests/team-spark-job-template.yaml; anything
        else needs a Job/Deployment/StatefulSet to own its Pods.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: spark-bare-pod-policy-binding
spec:
  policyName: spark-bare-pod-policy
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: team
          operator: Exists
