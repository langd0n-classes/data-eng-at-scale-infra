# spark-queue/portable/manifests/queue-controller-deployment.yaml
#
# Runs scripts/queue-controller.py as a single Deployment in the infra
# namespace (shared, per this repo's own namespace convention). RBAC is
# scoped to exactly what it needs — get/list/watch/patch on Jobs
# cluster-wide, nothing else, not full cluster-admin.
#
# Runs a pre-built image (spark-queue/portable/Dockerfile), published to
# GHCR by .github/workflows/build-queue-controller.yml on every commit
# touching spark-queue/portable/ — queue-controller.py is baked in, no
# ConfigMap mount and no pip install at pod startup.
#
# Usage:
#   SPARK_IMAGE_REPO="${SPARK_IMAGE%:*}" \
#   envsubst '${INFRA_NAMESPACE} ${SPARK_IMAGE_REPO} ${SPARK_QUEUE_CONTROLLER_IMAGE}' \
#     < spark-queue/portable/manifests/queue-controller-deployment.yaml | kubectl apply -f -
#
# Required vars: INFRA_NAMESPACE, SPARK_IMAGE_REPO (SPARK_IMAGE with its
# tag stripped — same value the admission policy itself matches on, so the
# controller only counts Jobs that are actually Spark jobs, not anything
# that merely carries the queue=spark label), SPARK_QUEUE_CONTROLLER_IMAGE
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-queue-controller
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: spark-queue-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spark-queue-controller-role
  labels:
    app: spark-queue-controller
rules:
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-queue-controller-binding
  labels:
    app: spark-queue-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spark-queue-controller-role
subjects:
  - kind: ServiceAccount
    name: spark-queue-controller
    namespace: ${INFRA_NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-queue-controller
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: spark-queue-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-queue-controller
  template:
    metadata:
      labels:
        app: spark-queue-controller
    spec:
      serviceAccountName: spark-queue-controller
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: controller
          image: ${SPARK_QUEUE_CONTROLLER_IMAGE}
          imagePullPolicy: Always
          env:
            - name: SPARK_IMAGE_REPO
              value: "${SPARK_IMAGE_REPO}"
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
