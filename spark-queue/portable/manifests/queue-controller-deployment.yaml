# spark-queue/portable/manifests/queue-controller-deployment.yaml
#
# Runs scripts/queue-controller.py as a single Deployment in the infra
# namespace. RBAC is scoped to exactly what it needs: get/list/watch/patch
# on Jobs, read-only on Pods (to detect a stuck job) — cluster-wide, not
# cluster-admin.
#
# strategy: Recreate, not the default RollingUpdate — a surging extra pod
# during redeploy would briefly run two uncoordinated controllers, each
# able to admit up to MAX_ACTIVE_JOBS on its own and double the cap.
#
# Runs a pre-built image, published to GHCR by
# .github/workflows/build-queue-controller.yml on every commit touching
# spark-queue/portable/ — no ConfigMap mount, no pip install at startup.
#
# Usage:
#   envsubst '${INFRA_NAMESPACE} ${SPARK_QUEUE_CONTROLLER_IMAGE}' \
#     < spark-queue/portable/manifests/queue-controller-deployment.yaml | kubectl apply -f -
#
# Required vars: INFRA_NAMESPACE, SPARK_QUEUE_CONTROLLER_IMAGE
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-queue-controller
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: spark-queue-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spark-queue-controller-role
  labels:
    app: spark-queue-controller
rules:
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-queue-controller-binding
  labels:
    app: spark-queue-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spark-queue-controller-role
subjects:
  - kind: ServiceAccount
    name: spark-queue-controller
    namespace: ${INFRA_NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-queue-controller
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: spark-queue-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-queue-controller
  template:
    metadata:
      labels:
        app: spark-queue-controller
    spec:
      serviceAccountName: spark-queue-controller
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: controller
          image: ${SPARK_QUEUE_CONTROLLER_IMAGE}
          imagePullPolicy: Always
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
