# registry/portable/manifests/registry.yaml
#
# In-cluster Docker Distribution registry (registry:2) — no external
# registry, no cloud account or credentials required. Deployed once into
# the infra namespace (shared, per this repo's own namespace convention).
#
# Exposed as a NodePort, not a plain ClusterIP: image PUSHES happen from
# inside a pod (the build-push-image Task), which can reach a ClusterIP's
# DNS name fine — but image PULLS are done by kubelet/containerd on the
# node itself, which resolves DNS using the node's own network namespace,
# not the cluster's pod-network DNS, and cannot resolve a
# `*.svc.cluster.local` name at all. A NodePort is reachable from every
# node via `localhost:<nodePort>` regardless of which node actually runs
# the registry pod (standard Kubernetes NodePort routing, not a Kind
# quirk), so every image reference in this platform — both the Task's
# `--destination` and every Deployment's `image:` field — uses
# `localhost:${REGISTRY_NODE_PORT}/<repo>:<tag>` consistently. The
# build-push-image Task's pod itself needs `hostNetwork: true` (set on its
# PipelineRun/TaskRun, see pipeline/portable/) so it can reach that
# same `localhost:<nodePort>` for the push, the same way kubelet does for
# the pull.
#
# Plain HTTP, no TLS — matches this repo's existing plaintext,
# educational-simplicity posture (see SECURITY.md).
#
# Usage:
#   source config.env && \
#   envsubst '${INFRA_NAMESPACE} ${STORAGE_CLASS} ${REGISTRY_VOLUME_SIZE} ${REGISTRY_NODE_PORT}' \
#   < registry/portable/manifests/registry.yaml | kubectl apply -f -
#
# Required vars: INFRA_NAMESPACE, STORAGE_CLASS, REGISTRY_VOLUME_SIZE, REGISTRY_NODE_PORT
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: registry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${STORAGE_CLASS}
  resources:
    requests:
      storage: ${REGISTRY_VOLUME_SIZE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: ${REGISTRY_NODE_PORT}
