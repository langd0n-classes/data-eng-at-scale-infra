# Task: deploy-event-generator
#
# Deploys or updates the event generator in the infra namespace.
#
# Prerequisites (applied once by setup.sh before this task runs):
#   - ImageStream: registered in OpenShift's internal registry
#   - BuildConfig: builds the Docker image from Git source
#     The BuildConfig's ConfigChange trigger fires the build automatically on
#     first apply. Subsequent applies only rebuild if the BuildConfig spec changes.
#
# What this task does:
#   Step 1 (check-prerequisites): verifies ImageStream and BuildConfig exist.
#                                  Fails fast with instructions if missing.
#   Step 2 (apply-configmap):     applies ConfigMap with current runtime config
#                                  (Kafka addresses, event rate, topics, regions)
#   Step 3 (apply-deployment):    applies Deployment and restarts it so the pod
#                                  picks up ConfigMap changes immediately.
#
# This Task is idempotent — running it again updates config without recreating resources.
#
# Note on topics: KAFKA_AUTO_CREATE_TOPICS_ENABLE=true is set on the Kafka broker,
# so topics are auto-created when the event generator first produces a message.
# No separate topic creation step is needed.
#
# Variables substituted via envsubst (source config.env first):
#   ${INFRA_NAMESPACE}  — config.env: INFRA_NAMESPACE  (namespace this Task lives in)
#   ${OC_CLI_IMAGE}     — config.env: OC_CLI_IMAGE     (OpenShift CLI image for task steps)
#
# NOTE: use scoped envsubst to avoid substituting bash ${VAR} inside the scripts:
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE} ${OC_CLI_IMAGE}' \
#     < pipeline/tasks/02-task-deploy-event-generator.yaml | oc apply -f -

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-event-generator
  namespace: ${INFRA_NAMESPACE}  # config.env: INFRA_NAMESPACE
  labels:
    app: tekton-pipeline
    component: event-generator
spec:
  description: |
    Deploys or updates the event generator in the infra namespace.
    Applies ConfigMap and Deployment; restarts the pod to pick up config changes.
    Requires ImageStream and BuildConfig to be pre-applied (setup.sh does this).

  params:
    - name: infra-namespace
      description: "Namespace where event generator runs (usually: infra)"
      type: string
      default: infra

    - name: event-generator-name
      description: "Name of the event generator deployment"
      type: string
      default: event-generator

    - name: team-bootstrap-servers
      description: |
        Team-to-Kafka mapping for multi-team mode.
        Format: team01=kafka-team01.team-01.svc.cluster.local:9092
        Multiple teams: team01=kafka-...:9092,team02=kafka-...:9092
      type: string

    - name: event-rate-per-sec
      description: "Events to generate per second"
      type: string
      default: "10"

    - name: topic-prefix
      description: "Prefix for auto-named topics (e.g., events.)"
      type: string
      default: "events."

    - name: topic-suffix
      description: "Suffix for auto-named topics (e.g., .raw)"
      type: string
      default: ".raw"

    - name: regions
      description: "Comma-separated geographic regions for simulation"
      type: string
      default: "Boston,NYC,Chicago,Seattle,Austin"

  workspaces:
    - name: source
      description: "Git repository containing event-generator/k8s/ files"

  steps:
    # Step 1: Verify ImageStream and BuildConfig exist before proceeding.
    # These are applied once by setup.sh. If missing, the image can't be built
    # and the Deployment will fail to pull. Fail fast with clear instructions.
    - name: check-prerequisites
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        EG_NAME="$(params.event-generator-name)"
        MISSING=false

        echo "Checking prerequisites for event generator deploy..."

        if ! oc get imagestream "${EG_NAME}" -n "${INFRA_NS}" &>/dev/null; then
          echo ""
          echo "ERROR: ImageStream '${EG_NAME}' not found in namespace '${INFRA_NS}'."
          echo "  The image build resources must be created before running this task."
          echo "  Run setup.sh first (it applies them automatically):"
          echo ""
          echo "    bash pipeline/setup.sh"
          echo ""
          echo "  Or apply manually:"
          echo "    source config.env && envsubst '\${INFRA_NAMESPACE} \${EVENT_GENERATOR_NAME}' \\"
          echo "      < event-generator/k8s/01-imagestream.yaml | oc apply -f -"
          MISSING=true
        fi

        if ! oc get buildconfig "${EG_NAME}" -n "${INFRA_NS}" &>/dev/null; then
          echo ""
          echo "ERROR: BuildConfig '${EG_NAME}' not found in namespace '${INFRA_NS}'."
          echo "  The image build resources must be created before running this task."
          echo "  Run setup.sh first (it applies them automatically):"
          echo ""
          echo "    bash pipeline/setup.sh"
          echo ""
          echo "  Or apply manually:"
          echo "    source config.env && envsubst '\${INFRA_NAMESPACE} \${EVENT_GENERATOR_NAME} \${GIT_REPO_URL} \${GIT_BRANCH}' \\"
          echo "      < event-generator/k8s/02-buildconfig.yaml | oc apply -f -"
          MISSING=true
        fi

        if [ "${MISSING}" = "true" ]; then
          exit 1
        fi

        echo "Prerequisites OK — ImageStream and BuildConfig exist."

    # Step 2: Apply ConfigMap with current runtime configuration.
    # This is what controls event rate, topic names, Kafka addresses, etc.
    # Changing any param and re-running the pipeline updates this ConfigMap.
    - name: apply-configmap
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        EG_NAME="$(params.event-generator-name)"
        SOURCE="$(workspaces.source.path)/event-generator/k8s"
        DOLLAR='$'

        echo "=================================================="
        echo "Applying ConfigMap with current configuration..."
        echo "  team-bootstrap-servers: $(params.team-bootstrap-servers)"
        echo "  event-rate-per-sec:     $(params.event-rate-per-sec)"
        echo "  topic-prefix:           $(params.topic-prefix)"
        echo "  topic-suffix:           $(params.topic-suffix)"
        echo "=================================================="

        # Substitute all template variables using sed
        # Using | as delimiter to avoid issues with / in URLs/paths
        APPLY_RESULT=$(sed \
          -e "s|${DOLLAR}{INFRA_NAMESPACE}|${INFRA_NS}|g" \
          -e "s|${DOLLAR}{EVENT_GENERATOR_NAME}|${EG_NAME}|g" \
          -e "s|${DOLLAR}{TEAM_BOOTSTRAP_SERVERS}|$(params.team-bootstrap-servers)|g" \
          -e "s|\${EVENT_RATE_PER_SEC}|$(params.event-rate-per-sec)|g" \
          -e "s|\${TOPIC_PREFIX}|$(params.topic-prefix)|g" \
          -e "s|\${TOPIC_SUFFIX}|$(params.topic-suffix)|g" \
          -e "s|\${REGIONS}|$(params.regions)|g" \
          -e "s|\${TOPIC}||g" \
          -e "s|\${KAFKA_BOOTSTRAP_SERVERS}||g" \
          "${SOURCE}/03-configmap.yaml" | oc apply -f -)
        echo "${APPLY_RESULT}"

        # Write marker file if configmap changed — deploy step uses this to decide restart
        if echo "${APPLY_RESULT}" | grep -q "configured"; then
          touch "$(workspaces.source.path)/.configmap-changed"
        fi

        echo ""
        echo "ConfigMap applied."

    # Step 3: Apply Deployment and restart to pick up ConfigMap changes.
    - name: apply-deployment
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        EG_NAME="$(params.event-generator-name)"
        SOURCE="$(workspaces.source.path)/event-generator/k8s"
        DOLLAR='$'

        echo "=================================================="
        echo "Applying Deployment..."
        echo "=================================================="
        sed \
          -e "s|${DOLLAR}{INFRA_NAMESPACE}|${INFRA_NS}|g" \
          -e "s|${DOLLAR}{EVENT_GENERATOR_NAME}|${EG_NAME}|g" \
          "${SOURCE}/04-deployment.yaml" | oc apply -f -

        # Only restart if configmap actually changed — avoids unnecessary rollout on idempotent runs
        if [ -f "$(workspaces.source.path)/.configmap-changed" ]; then
          echo ""
          echo "ConfigMap changed — restarting deployment to pick up new config..."
          oc rollout restart "deployment/${EG_NAME}" -n "${INFRA_NS}"
          echo "Waiting for rollout to complete..."
          oc rollout status "deployment/${EG_NAME}" -n "${INFRA_NS}" --timeout=600s
        else
          echo ""
          echo "ConfigMap unchanged — skipping rollout restart."
        fi

        echo ""
        echo "Event generator deployment applied."
