# Task: deploy-kafka
#
# Deploys a Kafka instance for a single team using the Kafka operator CR template
# from kafka/operator/kafka-cr-template.yaml in the repository.
#
# What it does:
#   Step 1 (apply-kafka): substitutes template variables and runs oc apply
#   Step 2 (wait-for-kafka): waits until the Kafka CR reports Ready (up to 5 min)
#
# This Task is idempotent — running it again when Kafka is already deployed
# will update the resources if anything changed, or do nothing if unchanged.
#
# Variables substituted via envsubst (source config.env first):
#   ${INFRA_NAMESPACE}  — config.env: INFRA_NAMESPACE  (namespace this Task lives in)
#   ${OC_CLI_IMAGE}     — config.env: OC_CLI_IMAGE     (OpenShift CLI image for task steps)
#
# NOTE: use scoped envsubst to avoid substituting bash ${VAR} inside the scripts:
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE} ${OC_CLI_IMAGE}' \
#     < pipeline/tasks/01-task-deploy-kafka.yaml | oc apply -f -

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-kafka
  namespace: ${INFRA_NAMESPACE}  # config.env: INFRA_NAMESPACE
  labels:
    app: tekton-pipeline
    component: kafka
spec:
  description: |
    Deploys a Kafka instance for a single team namespace using the operator CR
    template at kafka/operator/kafka-cr-template.yaml. Waits until the Kafka
    CR reports Ready status.

  params:
    - name: team-name
      description: "Team identifier used in resource names (e.g., team01)"
      type: string

    - name: team-namespace
      description: "OpenShift namespace where Kafka will be deployed (e.g., team-01)"
      type: string

    - name: storage-class
      description: "Storage class name for the Kafka PVC (check with: oc get sc)"
      type: string
      default: standard

  workspaces:
    - name: source
      description: Git repository containing kafka/operator/kafka-cr-template.yaml

  steps:
    # Step 1: Substitute template variables and apply the Kafka operator CRs
    - name: apply-kafka
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      script: |
        #!/bin/bash
        set -e

        TEAM_NAME="$(params.team-name)"
        TEAM_NAMESPACE="$(params.team-namespace)"
        STORAGE_CLASS="$(params.storage-class)"
        WORKSPACE="$(workspaces.source.path)"
        TEMPLATE="${WORKSPACE}/kafka/operator/kafka-cr-template.yaml"

        # Resolve workspace git SHA for idempotency check
        if command -v git &>/dev/null; then
          CURRENT_SHA=$(git -C "${WORKSPACE}" rev-parse HEAD 2>/dev/null || echo "")
        else
          CURRENT_SHA=$(cat "${WORKSPACE}/.git/HEAD" 2>/dev/null \
            | grep -E '^[0-9a-f]{40}$' || echo "")
        fi
        echo "Workspace commit: ${CURRENT_SHA:-unknown}"

        # Skip deploy if this exact commit is already deployed and Kafka CR is Ready.
        # To force a redeploy after a param-only change, delete the annotation first:
        #   oc annotate kafka kafka-${TEAM_NAME} -n ${TEAM_NAMESPACE} tekton.dev/git-sha-
        if [ -n "$CURRENT_SHA" ]; then
          DEPLOYED_SHA=$(oc get kafka "kafka-${TEAM_NAME}" -n "${TEAM_NAMESPACE}" \
            -o go-template='{{index .metadata.annotations "tekton.dev/git-sha"}}' 2>/dev/null || echo "")
          KAFKA_READY=$(oc get kafka "kafka-${TEAM_NAME}" -n "${TEAM_NAMESPACE}" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
          if [ "${DEPLOYED_SHA}" = "${CURRENT_SHA}" ] && [ "${KAFKA_READY}" = "True" ]; then
            echo "Kafka already deployed for commit ${CURRENT_SHA} and CR is Ready — skipping."
            exit 0
          fi
        fi

        echo "=================================================="
        echo "Deploying Kafka for team: $TEAM_NAME"
        echo "Namespace:                $TEAM_NAMESPACE"
        echo "Storage class:            $STORAGE_CLASS"
        echo "Template:                 $TEMPLATE"
        echo "=================================================="

        # Verify the template exists in the cloned repo
        if [ ! -f "$TEMPLATE" ]; then
          echo "ERROR: Template not found at $TEMPLATE"
          echo "Files in workspace kafka/operator/:"
          ls "${WORKSPACE}/kafka/operator/" || true
          exit 1
        fi

        # Verify the target namespace exists and is accessible
        if ! oc get pods -n "$TEAM_NAMESPACE" &>/dev/null; then
          echo "ERROR: Namespace $TEAM_NAMESPACE does not exist or is not accessible."
          echo "Please create it and apply RBAC before running this pipeline."
          exit 1
        fi

        # Substitute template variables and apply
        export TEAM_NAME TEAM_NAMESPACE STORAGE_CLASS
        envsubst < "$TEMPLATE" | oc apply -f -

        # Record deployed SHA so future runs can skip if nothing changed
        if [ -n "$CURRENT_SHA" ]; then
          oc annotate kafka "kafka-${TEAM_NAME}" -n "${TEAM_NAMESPACE}" \
            "tekton.dev/git-sha=${CURRENT_SHA}" --overwrite 2>/dev/null || true
        fi

        echo ""
        echo "Kafka operator CRs applied successfully."
        echo "Resources created/updated:"
        echo "  - KafkaNodePool: dual-role"
        echo "  - Kafka CR:      kafka-${TEAM_NAME}"
        echo "  - (operator creates: pod, services, PVC)"

    # Step 2: Wait until Kafka CR is Ready before proceeding
    - name: wait-for-kafka
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      script: |
        #!/bin/bash
        set -e

        TEAM_NAME="$(params.team-name)"
        TEAM_NAMESPACE="$(params.team-namespace)"

        echo "Waiting for Kafka CR kafka-${TEAM_NAME} to be Ready..."
        echo "(This can take 1-3 minutes on first deployment)"

        oc wait kafka "kafka-${TEAM_NAME}" \
          -n "$TEAM_NAMESPACE" \
          --for=condition=Ready \
          --timeout=300s

        echo ""
        echo "Kafka is Ready!"
        oc get kafka "kafka-${TEAM_NAME}" -n "$TEAM_NAMESPACE"
        echo ""
        echo "Bootstrap server:"
        echo "  kafka-${TEAM_NAME}-kafka-bootstrap.${TEAM_NAMESPACE}.svc.cluster.local:9092"
