# Task: deploy-grafana
#
# One-time task that deploys Grafana to the infra namespace.
# Runs once in the pipeline after all deploy-monitoring-teamN tasks complete.
#
# What it does:
#   Step 1 (apply-grafana-rbac):       creates grafana-sa, token Secret, ClusterRoleBinding,
#                                      and grafana-admin-secret from the grafana-admin-password param
#   Step 2 (wait-for-token):           polls until the SA token Secret is populated
#   Step 3 (apply-grafana-datasource): substitutes SA token into datasource ConfigMap template and applies
#   Step 4 (apply-grafana-provisioning): applies dashboard provisioning ConfigMap
#   Step 5 (fetch-dashboards):         curls Strimzi dashboard JSONs and creates grafana-dashboards ConfigMap
#   Step 6 (apply-grafana-deployment): applies Deployment, Service, Route
#   Step 7 (apply-podmonitor):         applies PodMonitor (covers all team namespaces, any: true)
#   Step 8 (wait-for-grafana):         waits for Grafana pod to be Running
#   Step 9 (print-url):               prints the Grafana Route URL
#
# Variables substituted via envsubst (source config.env first):
#   ${INFRA_NAMESPACE}  — config.env: INFRA_NAMESPACE
#   ${OC_CLI_IMAGE}     — config.env: OC_CLI_IMAGE
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE} ${OC_CLI_IMAGE}' \
#     < pipeline/tasks/08-task-deploy-grafana.yaml | oc apply -f -

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-grafana
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: tekton-pipeline
    component: monitoring
spec:
  description: |
    Deploys Grafana to the infra namespace with Strimzi dashboards pre-loaded
    and thanos-querier as the Prometheus datasource. Runs once after all per-team
    monitoring tasks have completed.

  params:
    - name: infra-namespace
      description: "Namespace where Grafana will be deployed"
      type: string
      default: "infra"

    - name: grafana-image
      description: "Grafana container image"
      type: string
      default: "docker.io/grafana/grafana:11.1.0"

    - name: grafana-admin-password
      description: "Grafana admin UI password"
      type: string

    - name: strimzi-version
      description: "Strimzi operator version (used to fetch matching dashboard JSONs)"
      type: string
      default: "0.51.0"

  workspaces:
    - name: source
      description: Git repository root containing monitoring/ manifests

  steps:
    # Step 1: Create grafana-sa, token Secret, ClusterRoleBinding, and admin password Secret
    - name: apply-grafana-rbac
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        WORKSPACE="$(workspaces.source.path)"

        echo "Applying grafana-sa ServiceAccount and token Secret..."
        sed -e "s|\${INFRA_NAMESPACE}|${INFRA_NS}|g" \
          "${WORKSPACE}/monitoring/grafana/07-grafana-sa.yaml" | oc apply -f -

        echo "Applying grafana ClusterRoleBinding (cluster-monitoring-view)..."
        sed -e "s|\${INFRA_NAMESPACE}|${INFRA_NS}|g" \
          "${WORKSPACE}/monitoring/grafana/08-grafana-clusterrolebinding.yaml" | oc apply -f -

        echo "Creating grafana-admin-secret..."
        oc create secret generic grafana-admin-secret \
          --from-literal=password="$(params.grafana-admin-password)" \
          -n "${INFRA_NS}" \
          --dry-run=client -o yaml | oc apply -f -

        echo "RBAC and admin secret applied."

    # Step 2: Wait for the SA token controller to populate grafana-sa-token
    - name: wait-for-token
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"

        echo "Waiting for grafana-sa-token to be populated..."
        for i in $(seq 1 30); do
          TOKEN=$(oc get secret grafana-sa-token -n "${INFRA_NS}" \
            -o jsonpath='{.data.token}' 2>/dev/null | base64 -d 2>/dev/null || echo "")
          if [ -n "${TOKEN}" ]; then
            echo "Token ready."
            exit 0
          fi
          echo "  attempt ${i}/30 — waiting 5s..."
          sleep 5
        done
        echo "ERROR: grafana-sa-token not populated after 150s"
        exit 1

    # Step 3: Build and apply the Grafana datasource ConfigMap (token substituted at runtime)
    - name: apply-grafana-datasource
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        WORKSPACE="$(workspaces.source.path)"

        TOKEN=$(oc get secret grafana-sa-token -n "${INFRA_NS}" \
          -o jsonpath='{.data.token}' | base64 -d)

        echo "Applying Grafana datasource ConfigMap..."
        sed \
          -e "s|\${INFRA_NAMESPACE}|${INFRA_NS}|g" \
          -e "s|\${GRAFANA_SA_TOKEN}|${TOKEN}|g" \
          "${WORKSPACE}/monitoring/grafana/04-grafana-datasource-configmap.yaml" \
          | oc apply -f -

        echo "Datasource ConfigMap applied."

    # Step 4: Apply dashboard provisioning ConfigMap
    - name: apply-grafana-provisioning
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        WORKSPACE="$(workspaces.source.path)"

        echo "Applying Grafana dashboard provisioning ConfigMap..."
        sed -e "s|\${INFRA_NAMESPACE}|${INFRA_NS}|g" \
          "${WORKSPACE}/monitoring/grafana/06-grafana-provisioning-configmap.yaml" \
          | oc apply -f -

        echo "Provisioning ConfigMap applied."

    # Step 5: Fetch Strimzi dashboard JSONs and create grafana-dashboards ConfigMap
    - name: fetch-dashboards
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        STRIMZI_VERSION="$(params.strimzi-version)"
        BASE_URL="https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/${STRIMZI_VERSION}/examples/metrics/grafana-dashboards"

        echo "Fetching Strimzi ${STRIMZI_VERSION} dashboard JSONs..."

        TMPDIR=$(mktemp -d)
        for dashboard in strimzi-kafka strimzi-kafka-exporter strimzi-operators; do
          echo "  fetching ${dashboard}.json..."
          curl -sSfL "${BASE_URL}/${dashboard}.json" \
            -o "${TMPDIR}/${dashboard}.json" || {
            echo "WARNING: failed to fetch ${dashboard}.json — skipping"
          }
        done

        # Build grafana-dashboards ConfigMap from fetched JSONs
        LITERAL_ARGS=()
        for f in "${TMPDIR}"/*.json; do
          [ -f "$f" ] || continue
          name=$(basename "$f")
          LITERAL_ARGS+=("--from-file=${name}=${f}")
        done

        if [ ${#LITERAL_ARGS[@]} -eq 0 ]; then
          echo "ERROR: No dashboard JSONs fetched — check network access from Tekton pod"
          exit 1
        fi

        echo "Creating grafana-dashboards ConfigMap with ${#LITERAL_ARGS[@]} dashboard(s)..."
        oc create configmap grafana-dashboards \
          "${LITERAL_ARGS[@]}" \
          -n "${INFRA_NS}" \
          --dry-run=client -o yaml | oc apply -f -

        echo "Dashboards ConfigMap applied."

    # Step 6: Apply Grafana Deployment, Service, Route
    - name: apply-grafana-deployment
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        GRAFANA_IMAGE="$(params.grafana-image)"
        WORKSPACE="$(workspaces.source.path)"

        echo "Applying Grafana Deployment, Service, Route..."

        for manifest in 01-grafana-deployment.yaml 02-grafana-service.yaml 03-grafana-route.yaml; do
          sed \
            -e "s|\${INFRA_NAMESPACE}|${INFRA_NS}|g" \
            -e "s|\${GRAFANA_IMAGE}|${GRAFANA_IMAGE}|g" \
            "${WORKSPACE}/monitoring/grafana/${manifest}" | oc apply -f -
        done

        echo "Grafana resources applied."

    # Step 7: Apply PodMonitor to infra namespace (covers all team Kafka pods)
    - name: apply-podmonitor
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        WORKSPACE="$(workspaces.source.path)"

        echo "Applying PodMonitor kafka-all-teams-metrics to ${INFRA_NS}..."

        sed -e "s|\${INFRA_NAMESPACE}|${INFRA_NS}|g" \
          "${WORKSPACE}/monitoring/kafka/kafka-podmonitor.yaml" | oc apply -f -

        echo "PodMonitor applied."

    # Step 8: Wait for Grafana pod to be Running
    - name: wait-for-grafana
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"

        echo "Waiting for Grafana pod to be Ready..."
        oc rollout status deployment/grafana -n "${INFRA_NS}" --timeout=120s

        echo "Grafana is Running."

    # Step 9: Print Grafana URL for the instructor
    - name: print-url
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      script: |
        #!/bin/bash

        INFRA_NS="$(params.infra-namespace)"

        GRAFANA_HOST=$(oc get route grafana -n "${INFRA_NS}" \
          -o jsonpath='{.spec.host}' 2>/dev/null || echo "")

        echo ""
        echo "=========================================="
        echo " Grafana deployed successfully!"
        echo "=========================================="
        echo ""
        if [ -n "${GRAFANA_HOST}" ]; then
          echo "  URL:   https://${GRAFANA_HOST}"
        fi
        echo "  Login: admin / <grafana-admin-password from config.env>"
        echo ""
        echo "Dashboards: Strimzi Kafka, Strimzi Kafka Exporter, Strimzi Operators"
        echo "(ZooKeeper panels show No data in KRaft mode — expected)"
        echo ""
