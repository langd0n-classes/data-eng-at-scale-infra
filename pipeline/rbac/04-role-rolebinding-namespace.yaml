# Role + RoleBinding for the `pipeline` ServiceAccount — fully namespace-scoped
#
# USE THIS FILE on shared clusters (e.g. NERC, any namespace-admin-only cluster)
# where you cannot create ClusterRoles or ClusterRoleBindings.
#
# Why `pipeline` SA?
#   On shared clusters only namespace-scoped permissions are available.
#   Tekton task pods need `pipelines-scc` to write to workspace volumes — this SCC
#   is auto-bound to the `pipeline` SA by the OpenShift Pipelines operator and cannot
#   be granted to a custom SA without cluster-admin access.
#   This Role gives `pipeline` exactly the permissions this project needs
#   (Kafka CRs, NiFi routes, PVCs, etc.) without relying on the broad
#   openshift-pipelines-edit ClusterRoleBinding.
#
# Apply once per namespace the pipeline needs to operate in:
#   - infra namespace (for event generator, imagestream, buildconfig)
#   - each team namespace (for Kafka statefulset, services, pvcs)
#
# Variables substituted via envsubst (source config.env first):
#   ${INFRA_NAMESPACE}  — config.env: INFRA_NAMESPACE  (where the pipeline SA lives)
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE}' \
#     < pipeline/rbac/04-role-rolebinding-namespace.yaml | oc apply -f - -n <namespace>
#
# Or loop over all namespaces:
#   for ns in infra team-01 team-02; do
#     source config.env && envsubst '${INFRA_NAMESPACE}' \
#       < pipeline/rbac/04-role-rolebinding-namespace.yaml | oc apply -f - -n $ns
#   done

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner-role
  labels:
    app: tekton-pipeline
    component: rbac
rules:
  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Workload resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # OpenShift build resources (for event generator image builds)
  - apiGroups: ["build.openshift.io"]
    resources:
      - buildconfigs
      - builds
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # OpenShift image resources (for event generator ImageStream)
  - apiGroups: ["image.openshift.io"]
    resources:
      - imagestreams
      - imagestreamtags
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Needed to watch pod status (oc wait --for=condition=Ready)
  - apiGroups: [""]
    resources:
      - pods/log
      - pods/exec
    verbs: ["get", "list", "watch"]

  # OpenShift Route resources (for NiFi UI ingress)
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # NetworkPolicy resources (for NiFi ingress from OpenShift router)
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PodDisruptionBudget — required to apply PDB per team after Kafka is ready
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Kafka operator CRs (Strimzi) — required to create/manage Kafka clusters
  - apiGroups: ["kafka.strimzi.io"]
    resources:
      - kafkas
      - kafkanodepools
      - kafkatopics
      - kafkausers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Kafka Console CR (StreamsHub) — required by deploy-console task (task 09)
  - apiGroups: ["console.streamshub.github.com"]
    resources:
      - consoles
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # RoleBindings — required to delete monitoring RoleBindings (e.g. prometheus-scrape) during teardown
  # Note: even --ignore-not-found triggers an RBAC check before the 404 lookup
  # Namespace admins on NERC already have this permission within their project namespace
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-binding
  labels:
    app: tekton-pipeline
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-runner-role
subjects:
  - kind: ServiceAccount
    name: pipeline                 # auto-created by OpenShift Pipelines operator
    namespace: ${INFRA_NAMESPACE}  # config.env: INFRA_NAMESPACE — where the SA lives
