# RoleBinding for pipeline SA — per team namespace (dedicated cluster)
#
# Use this file on dedicated clusters (e.g. CRC) where you have cluster-admin
# and applied 02-clusterrolebinding.yaml to create the ClusterRole.
#
# How it works:
#   - The ClusterRole (pipeline-runner-role) is defined in 02-clusterrolebinding.yaml
#   - This RoleBinding references that ClusterRole but scopes it to ONE namespace
#   - You need one RoleBinding per team namespace (setup.sh loops over all active teams)
#
# On shared clusters (NERC): use 04-role-rolebinding-namespace.yaml instead —
# it creates a namespace-scoped Role so no ClusterRole is needed.
#
# Variables substituted via envsubst (source config.env first):
#   ${INFRA_NAMESPACE}  — config.env: INFRA_NAMESPACE
#
# Apply for a single team:
#   source config.env && envsubst '${INFRA_NAMESPACE}' \
#     < pipeline/rbac/03-rolebinding-per-team.yaml | oc apply -f - -n <team-namespace>
#
# Or loop over all teams (see setup.sh dedicated-cluster path).

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-binding
  # namespace is set by the -n flag when you apply this file
  labels:
    app: tekton-pipeline
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole         # references the ClusterRole from 02-clusterrolebinding.yaml
  name: pipeline-runner-role  # but only applies within the namespace this RoleBinding is in
subjects:
  - kind: ServiceAccount
    name: pipeline                 # auto-created by OpenShift Pipelines operator
    namespace: ${INFRA_NAMESPACE}  # config.env: INFRA_NAMESPACE — SA lives here, not in team namespace
