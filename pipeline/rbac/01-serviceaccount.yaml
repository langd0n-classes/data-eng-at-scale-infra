# ServiceAccount: pipeline
#
# OpenShift Pipelines automatically creates the `pipeline` ServiceAccount in every
# namespace when the operator is installed. This file is a no-op on a live cluster
# (the SA already exists), but it documents which SA this project uses and keeps
# the apply-flow consistent.
#
# Why `pipeline` and not a custom SA?
#   On shared clusters (e.g. NERC) only namespace-scoped permissions are available.
#   Tekton task pods need `pipelines-scc` (set by the OpenShift Pipelines operator)
#   to write to workspace volumes. That SCC is auto-bound only to the `pipeline` SA.
#   A custom SA like pipeline-runner cannot receive the SCC binding without
#   cluster-admin — which is not available on shared clusters.
#   Custom namespace-scoped RBAC (Roles + RoleBindings in files 03/04) gives
#   `pipeline` exactly the permissions this project needs in each namespace.
#
# Variables substituted via envsubst (source config.env first):
#   ${INFRA_NAMESPACE}  — config.env: INFRA_NAMESPACE
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE}' \
#     < pipeline/rbac/01-serviceaccount.yaml | oc apply -f -

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline                 # auto-created by OpenShift Pipelines operator
  namespace: ${INFRA_NAMESPACE}  # config.env: INFRA_NAMESPACE
  labels:
    app: tekton-pipeline
    component: rbac
