# pipeline/portable/rbac/clusterrolebinding.yaml
#
# kubectl-only equivalent of pipeline/rbac/02-clusterrolebinding.yaml — same
# shape (one ClusterRole covering every namespace the pipeline deploys
# into, bound once to the `pipeline` ServiceAccount), minus every
# OpenShift-only API group (build.openshift.io, image.openshift.io,
# route.openshift.io — none of them apply here) and minus the Kafka
# Console CR (kept outside this deployment path).
#
# One addition beyond the OpenShift version: a `namespaces` read rule.
# pipeline/portable/tasks/deploy-kafka-task.yaml reuses
# kafka/portable/scripts/deploy.sh as-is (rather than duplicating its
# logic), and that script checks the target namespace exists before doing
# anything else — a safety check the OpenShift task's own inline script
# never had, so its ClusterRole never needed this rule.
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE}' \
#     < pipeline/portable/rbac/clusterrolebinding.yaml | kubectl apply -f -
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipeline-runner-role-portable
  labels:
    app: tekton-pipeline
    component: rbac
rules:
  # Cluster-scoped: read-only existence check before deploying into a team
  # namespace (see header comment above)
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list", "watch"]

  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Workload resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Needed to watch pod status (kubectl wait --for=condition=Ready)
  - apiGroups: [""]
    resources:
      - pods/log
      - pods/exec
    verbs: ["get", "list", "watch"]

  # Needed to trigger rollout restarts
  - apiGroups: ["apps"]
    resources:
      - deployments/rollout
    verbs: ["update", "patch"]

  # PodDisruptionBudget — required to apply PDB per team after Kafka is ready
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Kafka operator CRs (Strimzi) — required to create/manage Kafka clusters
  - apiGroups: ["kafka.strimzi.io"]
    resources:
      - kafkas
      - kafkanodepools
      - kafkatopics
      - kafkausers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # RoleBindings — required to delete monitoring RoleBindings during teardown
  # Note: even --ignore-not-found triggers an RBAC check before the 404 lookup
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# Bind the ClusterRole to our ServiceAccount in infra namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipeline-runner-binding-portable
  labels:
    app: tekton-pipeline
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipeline-runner-role-portable
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: ${INFRA_NAMESPACE}
