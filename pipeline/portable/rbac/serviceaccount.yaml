# pipeline/portable/rbac/serviceaccount.yaml
#
# kubectl-only equivalent of pipeline/rbac/01-serviceaccount.yaml. Unlike
# the OpenShift path, this SA isn't auto-created by an operator and
# doesn't need an SCC binding — Tekton Pipelines' own ServiceAccounts run
# under standard Pod Security on vanilla Kubernetes.
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE}' \
#     < pipeline/portable/rbac/serviceaccount.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: tekton-pipeline
    component: rbac
