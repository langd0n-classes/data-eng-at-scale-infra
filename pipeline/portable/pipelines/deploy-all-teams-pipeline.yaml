    - name: EVENT_GENERATOR_NAME
      type: string
    - name: EVENT_GENERATOR_IMAGE
      description: Full image reference to build and push, and later deploy from
      type: string
    - name: EVENT_GENERATOR_DOCKERFILE
      type: string
      default: ./Dockerfile
    - name: EVENT_GENERATOR_CONTEXT
      type: string
      default: event-generator
    - name: EVENT_RATE_PER_SEC
      type: string
    - name: TOPIC_PREFIX
      type: string
    - name: TOPIC_SUFFIX
      type: string
    - name: TOPIC
      type: string
      default: ""
    - name: REGIONS
      type: string
    - name: TEAM_BOOTSTRAP_SERVERS
      description: team_id=bootstrap_server,team_id=bootstrap_server,...
      type: string
    - name: KAFKA_BOOTSTRAP_SERVERS
      type: string
      default: ""
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: URL
          value: $(params.GIT_URL)
        - name: REVISION
          value: $(params.GIT_REVISION)
      workspaces:
        - name: output
          workspace: source

    - name: build-event-generator-image
      taskRef:
        name: build-push-image
      runAfter: ["clone"]
      params:
        - name: IMAGE
          value: $(params.EVENT_GENERATOR_IMAGE)
        - name: DOCKERFILE
          value: $(params.EVENT_GENERATOR_DOCKERFILE)
        - name: CONTEXT
          value: $(params.EVENT_GENERATOR_CONTEXT)
      workspaces:
        - name: source
          workspace: source

    - name: deploy-kafka-team1
      taskRef:
        name: deploy-kafka
      runAfter: ["clone"]
      when:
        - input: $(params.TEAM1_NAME)
          operator: notin
          values: ["", "skip"]
      params:
        - name: TEAM_NAME
          value: $(params.TEAM1_NAME)
        - name: TEAM_NAMESPACE
          value: $(params.TEAM1_NAMESPACE)
        - name: STORAGE_CLASS
          value: $(params.STORAGE_CLASS)
        - name: VOLUME_SIZE
