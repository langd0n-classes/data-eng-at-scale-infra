      type: string
    - name: GIT_REVISION
      type: string
      default: main
    - name: INFRA_NAMESPACE
      type: string
    - name: STORAGE_CLASS
      type: string
    - name: VOLUME_SIZE
      type: string
    - name: TEAM1_NAME
      type: string
      default: ""
    - name: TEAM1_NAMESPACE
      type: string
      default: ""
    - name: TEAM2_NAME
      type: string
      default: ""
    - name: TEAM2_NAMESPACE
      type: string
      default: ""
