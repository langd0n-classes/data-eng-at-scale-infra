# pipeline/portable/pipelines/deploy-all-teams-pipeline.yaml
#
# kubectl-only equivalent of pipeline/pipelines/01-pipeline-deploy-all-teams.yaml
# — same shape (clone once, deploy every team's Kafka in parallel, deploy
# the shared event generator once afterward, since it needs every team's
# bootstrap address) and the same one-explicit-Task-block-per-team pattern
# (Tekton's `matrix` feature can't derive one param from another within
# the same PipelineTask, e.g. building "team-01" out of "team" + "01", so
# it doesn't fit this shape any more cleanly than the existing pipeline's
# own hardcoded-per-team blocks already do — that file hardcodes team01
# through team15 the same way, matching config.env's TEAM1...TEAM15
# support). The one real difference: no NiFi task anywhere in this chain —
# nifi/ itself stays fully available and untouched, only the pipeline's
# dependency on deploying it is removed here.
#
# Runs entirely in the infra namespace; per-team Tasks act on team
# namespaces via the pipeline ServiceAccount's cluster-wide RBAC (see
# pipeline/portable/rbac/).
#
# Every TEAMn_NAME/TEAMn_NAMESPACE defaults to "" and each
# deploy-kafka-teamN task carries a `when` guard skipping it entirely when
# its own TEAMn_NAME is blank or "skip" — a class with fewer than 15 teams
# just leaves the unused slots unset (or "skip", matching config.env's own
# existing convention for marking a team slot unused) rather than needing
# a trimmed-down copy of this file.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: deploy-all-teams
  namespace: infra
  labels:
    app: data-eng-infra
spec:
  params:
