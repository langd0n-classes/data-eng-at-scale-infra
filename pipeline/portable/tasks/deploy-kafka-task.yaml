# pipeline/portable/tasks/deploy-kafka-task.yaml
#
# kubectl-wraps kafka/portable/scripts/deploy.sh from a git-cloned copy of
# this repo, so a team's PipelineRun deploys its own Kafka the exact same
# way kafka/portable/README.md's validation walkthrough already proved
# works, rather than duplicating that script's logic here. Assumes the
# Strimzi operator is already installed cluster-wide (a one-time
# prerequisite, done outside Tekton — see kafka/portable/prerequisites/).
#
# Defined once in the infra namespace (shared, per this repo's own
# namespace convention) and referenced from the deploy-all-teams pipeline
# via Tekton's `cluster` resolver.
#
# Usage:
#   source config.env && envsubst '${KUBECTL_CLI_IMAGE}' \
#   < pipeline/portable/tasks/deploy-kafka-task.yaml | kubectl apply -f - -n infra
#
# Required vars: KUBECTL_CLI_IMAGE
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-kafka
  namespace: infra
  labels:
    app: data-eng-infra
spec:
  params:
    - name: TEAM_NAME
      description: Team identifier, e.g. team01
      type: string
    - name: TEAM_NAMESPACE
      description: Team namespace, e.g. team-01
      type: string
    - name: STORAGE_CLASS
      type: string
    - name: VOLUME_SIZE
      type: string
    - name: TOPIC_PREFIX
      description: Raw topic name prefix, as the event generator uses it
      type: string
      default: "events."
    - name: TOPIC_SUFFIX
      description: Raw topic name suffix, as the event generator uses it
      type: string
      default: ".raw"
    - name: KAFKA_CLI_IMAGE
      description: Image with the Kafka command-line tools, matching the broker
      type: string
      default: quay.io/strimzi/kafka:0.51.0-kafka-4.2.0
  workspaces:
    - name: source
      description: Git-cloned copy of this repo
  steps:
    - name: deploy-kafka
      image: ${KUBECTL_CLI_IMAGE}
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        bash kafka/portable/scripts/deploy.sh \
          "$(params.TEAM_NAME)" "$(params.TEAM_NAMESPACE)" \
          "$(params.STORAGE_CLASS)" "$(params.VOLUME_SIZE)"
    # The team's raw topic keeps every event for the whole term: later
    # project phases read the team's full history. The broker default
    # (24 hours or 100 MB) still applies to topics that teams create.
    # Runs after the Kafka is Ready, and is safe to repeat: it creates the
    # topic when it is missing and sets its retention either way.
    - name: raw-topic-retention
      image: $(params.KAFKA_CLI_IMAGE)
      env:
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx256m"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        BOOTSTRAP="kafka-$(params.TEAM_NAME)-kafka-bootstrap.$(params.TEAM_NAMESPACE).svc:9092"
        TOPIC="$(params.TOPIC_PREFIX)$(params.TEAM_NAME)$(params.TOPIC_SUFFIX)"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" \
          --create --if-not-exists --topic "${TOPIC}" --partitions 1 \
          --config retention.ms=-1 --config retention.bytes=-1
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server "${BOOTSTRAP}" \
          --alter --entity-type topics --entity-name "${TOPIC}" \
          --add-config retention.ms=-1,retention.bytes=-1
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server "${BOOTSTRAP}" \
          --describe --entity-type topics --entity-name "${TOPIC}"
