# pipeline/portable/tasks/check-source-changed-task.yaml
#
# Content-hashes what the Dockerfile actually copies (src/ + Dockerfile,
# not README/CLAUDE.md/portable/ — unrelated doc edits shouldn't trigger a
# rebuild) PLUS the event generator's own runtime config values (CONFIG_VALUES
# — EVENT_RATE_PER_SEC, TOPIC_PREFIX/SUFFIX, TOPIC, REGIONS,
# TEAM_BOOTSTRAP_SERVERS, KAFKA_BOOTSTRAP_SERVERS), and compares the combined
# hash to the `source-hash` annotation already on a Deployment — so the
# pipeline can skip an unnecessary rebuild+redeploy when nothing actually
# changed, but still catches a config-only change (e.g. a student count
# change to EVENT_RATE_PER_SEC) that never touched the code at all. Confirmed
# directly as a real gap before this: hashing code alone meant a config-only
# change was silently never applied on retrigger. The same check
# event-generator/portable/build-and-push.sh does standalone, now available
# to the pipeline too. Deliberately kept separate from
# build-push-image-task.yaml (which stays generic, build+push only, reusable
# for any image) rather than baked into it.
#
# Hash algorithm must match build-and-push.sh's combined_hash() exactly
# (sha256 over sorted file paths + contents, same src/+Dockerfile scope,
# combined with the same pipe-delimited config string), or the two would
# disagree about whether source changed depending on which tool built it
# last.
#
# Usage: referenced from a PipelineRun/Pipeline, not applied standalone
# beyond `kubectl apply -f check-source-changed-task.yaml -n infra`.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-source-changed
  namespace: infra
  labels:
    app: data-eng-infra
spec:
  params:
    - name: DEPLOYMENT_NAME
      description: Deployment whose source-hash annotation to compare against
      type: string
    - name: NAMESPACE
      type: string
    - name: CONTEXT
      description: Subdirectory within the source workspace to hash
      type: string
    - name: CONFIG_VALUES
      description: Pipe-delimited runtime config values folded into the hash too, so a config-only change (not just code) still triggers a redeploy
      type: string
      default: ""
  workspaces:
    - name: source
  results:
    - name: changed
      description: "\"true\" if a (re)build+deploy is needed, \"false\" to skip"
    - name: hash
      description: The newly computed content hash, for the deploy Task to stamp on the Deployment
  steps:
    - name: check
      image: ${KUBECTL_CLI_IMAGE}
      workingDir: $(workspaces.source.path)
      # Params passed as env vars, not substituted directly into the script
      # text — Tekton's $(params.X) is a literal text replacement done
      # before bash ever parses the script, so a value containing a
      # backtick, $(), or an unescaped quote could break out of string
      # context or inject a command. CONFIG_VALUES in particular is built
      # from config.env values (TEAM_BOOTSTRAP_SERVERS, REGIONS, ...) that
      # this Task doesn't control the exact contents of.
      env:
        - name: CONTEXT
          value: $(params.CONTEXT)
        - name: CONFIG_VALUES
          value: $(params.CONFIG_VALUES)
        - name: DEPLOYMENT_NAME
          value: $(params.DEPLOYMENT_NAME)
        - name: NAMESPACE
          value: $(params.NAMESPACE)
      script: |
        #!/bin/bash
        set -euo pipefail
        CODE_HASH="$(cd "${CONTEXT}" && find src Dockerfile -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}')"
        NEW_HASH="$(printf '%s' "${CODE_HASH}${CONFIG_VALUES}" | sha256sum | awk '{print $1}')"
        PREV_HASH="$(kubectl get deployment "${DEPLOYMENT_NAME}" -n "${NAMESPACE}" -o jsonpath='{.metadata.annotations.source-hash}' 2>/dev/null || true)"

        echo -n "${NEW_HASH}" > "$(results.hash.path)"

        if kubectl get deployment "${DEPLOYMENT_NAME}" -n "${NAMESPACE}" >/dev/null 2>&1 \
           && [[ -n "${PREV_HASH}" && "${PREV_HASH}" == "${NEW_HASH}" ]]; then
          echo "Source unchanged (${NEW_HASH:0:12}...) — skipping build+deploy."
          echo -n "false" > "$(results.changed.path)"
        else
          echo "Source changed (or first deploy) — proceeding with build+deploy."
          echo -n "true" > "$(results.changed.path)"
        fi
