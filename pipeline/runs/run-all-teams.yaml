# PipelineRun: deploy all teams
#
# Deploys Kafka + NiFi for every team that is NOT set to "skip" in config.env,
# then updates the event generator once with all bootstrap servers.
#
# All values come from config.env — source it first, then run:
#
#   source config.env && envsubst < pipeline/runs/run-all-teams.yaml | oc create -f -
#
# HOW TO USE:
#   1. Set TEAM1_NAME/NAMESPACE through TEAM15_NAME/NAMESPACE in config.env.
#      Set unused teams to "skip" — their tasks are automatically bypassed.
#   2. Set TEAM_BOOTSTRAP_SERVERS to ALL teams you are deploying (comma-separated).
#   3. Set TEAM1_PASSWORD through TEAM15_PASSWORD (use "skip" for unused teams).
#   4. Run the command above.
#
# Variables used (all from config.env):
#   ${INFRA_NAMESPACE}           — shared infra namespace
#   ${GIT_REPO_URL}              — your forked repo URL
#   ${GIT_BRANCH}                — branch to deploy from
#   ${STORAGE_CLASS}             — PVC storage class for Kafka + NiFi
#   ${EVENT_GENERATOR_NAME}      — event generator deployment name
#   serviceAccountName           — hardcoded as "pipeline" (default OpenShift Pipelines SA)
#   ${TEKTON_WORKSPACE_SIZE}     — shared workspace PVC size
#   ${TEAM_BOOTSTRAP_SERVERS}    — all Kafka addresses comma-separated (ALL active teams)
#   ${TEAM1_NAME} / ${TEAM1_NAMESPACE}   — team 1  (set to "skip" to bypass)
#   ${TEAM2_NAME} / ${TEAM2_NAMESPACE}   — team 2
#   ...
#   ${TEAM15_NAME} / ${TEAM15_NAMESPACE} — team 15
#   ${NIFI_IMAGE}                — NiFi container image
#   ${EXTERNAL_DOMAIN}           — OpenShift cluster wildcard domain
#   ${TEAM1_PASSWORD} ... ${TEAM15_PASSWORD} — per-team NiFi passwords
#   ${EVENT_RATE_PER_SEC}        — events per second
#   ${TOPIC_PREFIX}              — Kafka topic name prefix
#   ${TOPIC_SUFFIX}              — Kafka topic name suffix
#   ${REGIONS}                   — comma-separated regions
#
# HOW TO WATCH:
#   tkn pipelinerun logs deploy-all-teams-run-001 -f -n ${INFRA_NAMESPACE}
#
# IMPORTANT: Change the run name suffix (run-001 → run-002) on each new execution
# to avoid name collisions — Tekton PipelineRun names must be unique.

apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: deploy-all-teams-run-001        # change suffix for each new run
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: tekton-pipeline
spec:
  serviceAccountName: pipeline  # default SA created by OpenShift Pipelines in every namespace

  pipelineRef:
    name: deploy-all-teams

  params:
    # ── Git source ──────────────────────────────────────────────────────────
    - name: git-url
      value: ${GIT_REPO_URL}

    - name: git-revision
      value: ${GIT_BRANCH}

    - name: storage-class
      value: ${STORAGE_CLASS}

    # ── Infra namespace is derived automatically from $(context.pipelineRun.namespace)
    # No need to pass infra-namespace — the pipeline derives it from context.

    - name: event-generator-name
      value: ${EVENT_GENERATOR_NAME}

    # ── Teams 1-15 (set to "skip" in config.env to bypass) ──────────────────
    - name: team1-name
      value: ${TEAM1_NAME}
    - name: team1-namespace
      value: ${TEAM1_NAMESPACE}

    - name: team2-name
      value: ${TEAM2_NAME}
    - name: team2-namespace
      value: ${TEAM2_NAMESPACE}

    - name: team3-name
      value: ${TEAM3_NAME}
    - name: team3-namespace
      value: ${TEAM3_NAMESPACE}

    - name: team4-name
      value: ${TEAM4_NAME}
    - name: team4-namespace
      value: ${TEAM4_NAMESPACE}

    - name: team5-name
      value: ${TEAM5_NAME}
    - name: team5-namespace
      value: ${TEAM5_NAMESPACE}

    - name: team6-name
      value: ${TEAM6_NAME}
    - name: team6-namespace
      value: ${TEAM6_NAMESPACE}

    - name: team7-name
      value: ${TEAM7_NAME}
    - name: team7-namespace
      value: ${TEAM7_NAMESPACE}

    - name: team8-name
      value: ${TEAM8_NAME}
    - name: team8-namespace
      value: ${TEAM8_NAMESPACE}

    - name: team9-name
      value: ${TEAM9_NAME}
    - name: team9-namespace
      value: ${TEAM9_NAMESPACE}

    - name: team10-name
      value: ${TEAM10_NAME}
    - name: team10-namespace
      value: ${TEAM10_NAMESPACE}

    - name: team11-name
      value: ${TEAM11_NAME}
    - name: team11-namespace
      value: ${TEAM11_NAMESPACE}

    - name: team12-name
      value: ${TEAM12_NAME}
    - name: team12-namespace
      value: ${TEAM12_NAMESPACE}

    - name: team13-name
      value: ${TEAM13_NAME}
    - name: team13-namespace
      value: ${TEAM13_NAMESPACE}

    - name: team14-name
      value: ${TEAM14_NAME}
    - name: team14-namespace
      value: ${TEAM14_NAMESPACE}

    - name: team15-name
      value: ${TEAM15_NAME}
    - name: team15-namespace
      value: ${TEAM15_NAMESPACE}

    # ── NiFi shared config ───────────────────────────────────────────────────
    - name: nifi-image
      value: "${NIFI_IMAGE}"

    - name: external-domain
      value: "${EXTERNAL_DOMAIN}"

    # ── NiFi per-team passwords ──────────────────────────────────────────────
    - name: team1-password
      value: "${TEAM1_PASSWORD}"
    - name: team2-password
      value: "${TEAM2_PASSWORD}"
    - name: team3-password
      value: "${TEAM3_PASSWORD}"
    - name: team4-password
      value: "${TEAM4_PASSWORD}"
    - name: team5-password
      value: "${TEAM5_PASSWORD}"
    - name: team6-password
      value: "${TEAM6_PASSWORD}"
    - name: team7-password
      value: "${TEAM7_PASSWORD}"
    - name: team8-password
      value: "${TEAM8_PASSWORD}"
    - name: team9-password
      value: "${TEAM9_PASSWORD}"
    - name: team10-password
      value: "${TEAM10_PASSWORD}"
    - name: team11-password
      value: "${TEAM11_PASSWORD}"
    - name: team12-password
      value: "${TEAM12_PASSWORD}"
    - name: team13-password
      value: "${TEAM13_PASSWORD}"
    - name: team14-password
      value: "${TEAM14_PASSWORD}"
    - name: team15-password
      value: "${TEAM15_PASSWORD}"

    # ── Event generator config ───────────────────────────────────────────────
    # TEAM_BOOTSTRAP_SERVERS must list ALL active teams comma-separated
    - name: all-team-bootstrap-servers
      value: "${TEAM_BOOTSTRAP_SERVERS}"

    - name: event-rate-per-sec
      value: "${EVENT_RATE_PER_SEC}"

    - name: topic-prefix
      value: "${TOPIC_PREFIX}"

    - name: topic-suffix
      value: "${TOPIC_SUFFIX}"

    - name: regions
      value: "${REGIONS}"

    - name: chatops-enabled
      value: "${CHATOPS_ENABLED}"
    - name: chatops-name
      value: "${CHATOPS_NAME}"
    - name: admin-channel-id
      value: "${ADMIN_CHANNEL_ID}"

    # ── Observability ────────────────────────────────────────────────────────
    - name: grafana-image
      value: "${GRAFANA_IMAGE}"
    - name: grafana-admin-password
      value: "${GRAFANA_ADMIN_PASSWORD}"
    - name: strimzi-version
      value: "${STRIMZI_VERSION}"

  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: ${TEKTON_WORKSPACE_SIZE}
