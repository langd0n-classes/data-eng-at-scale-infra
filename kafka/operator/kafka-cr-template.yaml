# Kafka operator CR template for individual teams
# Deploys one Kafka instance per team namespace via the Strimzi operator
# Variables: TEAM_NAME, TEAM_NAMESPACE, STORAGE_CLASS
#
# Key features:
# - KRaft mode (no ZooKeeper) via KafkaNodePool dual-role
# - Single PLAINTEXT listener on port 9092
# - Reduced resource footprint for multi-tenant deployments
# - 24-hour log retention with aggressive cleanup
# - Auto-topic creation enabled
# - Entity Operator included (TopicOperator + UserOperator)
#
# Deploy with:
#   export TEAM_NAME=team01
#   export TEAM_NAMESPACE=team-01
#   export STORAGE_CLASS=standard
#   envsubst < kafka-cr-template.yaml | kubectl apply -f -
#
# Bootstrap DNS (Strimzi auto-creates):
#   kafka-${TEAM_NAME}-kafka-bootstrap.${TEAM_NAMESPACE}.svc.cluster.local:9092
#
# Pod name pattern:
#   kafka-${TEAM_NAME}-dual-role-0
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: ${TEAM_NAMESPACE}
  labels:
    strimzi.io/cluster: kafka-${TEAM_NAME}
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: false
    class: ${STORAGE_CLASS}
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-${TEAM_NAME}
  namespace: ${TEAM_NAMESPACE}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    metadataVersion: 4.2-IV0
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: "true"

      # Aggressive log retention for demo/test environments
      log.retention.hours: 24
      log.retention.bytes: 104857600       # 100MB max per partition
      log.segment.bytes: 52428800          # 50MB segment size
      log.cleanup.policy: delete
      log.retention.check.interval.ms: 300000  # Check every 5 minutes
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  entityOperator:
    topicOperator: {}
    userOperator: {}
