# Shared A03 Kafka broker.
#
# One single-node KRaft cluster for all A03 teams, reachable from outside the
# cluster through a LoadBalancer listener with TLS and SCRAM-SHA-512 logins.
# Each team's KafkaUser (see users.yaml.tmpl) can use only topics and consumer
# groups whose names start with its team prefix, such as `team03.`.
#
# This broker is separate from the per-team final-project brokers.
# Do not connect it to the final-project event path.
#
# Requires the Strimzi Cluster Operator watching this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: a03-kafka
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: a03-kafka
  labels:
    strimzi.io/cluster: a03
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: csi-cinder-high-speed-gen2
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
  jvmOptions:
    -Xms: 1g
    -Xmx: 1g
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: a03
  namespace: a03-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 4.2-IV0
    listeners:
      # In-cluster listener for staff checks from a pod.
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
      # Student listener.
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Students create their own topics.
      auto.create.topics.enable: "false"
      num.partitions: 3
      # Keep A03 data until the assignment closes; cap disk use per partition.
      log.retention.hours: 504
      log.retention.bytes: 104857600
      log.segment.bytes: 52428800
      log.cleanup.policy: delete
  entityOperator:
    userOperator: {}
