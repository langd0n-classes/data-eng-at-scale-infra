# NetworkPolicy to allow OpenShift router ingress to NiFi pods only.
# Scoped to NiFi pods via podSelector — does NOT restrict Kafka or other
# pods in the namespace. Without this scope, podSelector: {} applies to
# all pods and blocks the event generator (in infra) from reaching Kafka.
# Variables: TEAM_NAMESPACE, TEAM_NAME
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-openshift-ingress
  namespace: ${TEAM_NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: nifi-${TEAM_NAME}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  policyTypes:
    - Ingress
