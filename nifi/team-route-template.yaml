# Route template for team NiFi access (OpenShift only)
# Variables: TEAM_NAME, TEAM_NAMESPACE
# Note: spec.host is intentionally omitted — OpenShift auto-generates the hostname
# as: nifi-{TEAM_NAME}-{TEAM_NAMESPACE}.{cluster-wildcard-domain}
# The cert CN/SAN and NIFI_WEB_PROXY_HOST in the StatefulSet must match this pattern.
# On vanilla Kubernetes, replace this with a standard Ingress resource.
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nifi-${TEAM_NAME}
  namespace: ${TEAM_NAMESPACE}
  labels:
    app: nifi-${TEAM_NAME}
spec:
  to:
    kind: Service
    name: nifi-${TEAM_NAME}
  port:
    targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
