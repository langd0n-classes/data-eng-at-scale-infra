# onboarding/01c-infra-resourcequota.yaml — ResourceQuota for infra namespace
#
# Caps total CPU, memory, and storage the infra namespace can consume.
# Sized larger than team namespaces since infra runs shared cluster-level workloads.
#
# Usage:
#   source onboarding/cluster.env && \
#   envsubst '${INFRA_NAMESPACE} ${INFRA_RESOURCE_QUOTA_CPU} \
#             ${INFRA_RESOURCE_QUOTA_MEMORY} ${INFRA_RESOURCE_QUOTA_STORAGE}' \
#   < onboarding/01c-infra-resourcequota.yaml | oc apply -f -
#
# Called by: onboarding/apply-onboarding.sh (Step 3)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: infra-quota
  namespace: ${INFRA_NAMESPACE}
spec:
  hard:
    requests.cpu: ${INFRA_RESOURCE_QUOTA_CPU}
    requests.memory: ${INFRA_RESOURCE_QUOTA_MEMORY}
    limits.cpu: ${INFRA_RESOURCE_QUOTA_CPU}
    limits.memory: ${INFRA_RESOURCE_QUOTA_MEMORY}
    requests.storage: ${INFRA_RESOURCE_QUOTA_STORAGE}
