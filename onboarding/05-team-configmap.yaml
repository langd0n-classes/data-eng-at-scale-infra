# onboarding/05-team-configmap.yaml — Team shared config + credential placeholder
#
# Creates a ConfigMap with connection details students need to access Kafka and
# NiFi in their namespace, and a Secret placeholder for per-team credentials.
# Students can read these from their namespace after Tekton deploys Kafka/NiFi.
#
# Usage (single team, manual):
#   source config.env && \
#   export TEAM_ID=01 && \
#   envsubst '${TEAM_NAMESPACE_PREFIX} ${TEAM_ID} \
#             ${INFRA_NAMESPACE} ${EXTERNAL_DOMAIN} ${NIFI_CLUSTER_NAME}' \
#   < onboarding/05-team-configmap.yaml | oc apply -f -
#
# Called by: onboarding/apply-onboarding.sh (Step 6 loop)
# Note: vars come from config.env (INFRA_NAMESPACE, EXTERNAL_DOMAIN, NIFI_CLUSTER_NAME)
#       and cluster.env (TEAM_NAMESPACE_PREFIX)
# Required vars: TEAM_NAMESPACE_PREFIX, TEAM_ID,
#   INFRA_NAMESPACE, EXTERNAL_DOMAIN, NIFI_CLUSTER_NAME
apiVersion: v1
kind: ConfigMap
metadata:
  name: team-shared-config
  namespace: ${TEAM_NAMESPACE_PREFIX}-${TEAM_ID}
data:
  team-id: "team${TEAM_ID}"
  kafka-bootstrap: "${KAFKA_CLUSTER_NAME}-kafka-bootstrap.${TEAM_NAMESPACE_PREFIX}-${TEAM_ID}.svc.cluster.local:9092"
  nifi-url: "https://${NIFI_CLUSTER_NAME}-${TEAM_NAMESPACE_PREFIX}-${TEAM_ID}.${EXTERNAL_DOMAIN}"
  infra-namespace: "${INFRA_NAMESPACE}"
  deployment-mode: "per-team"
---
# Credential placeholder — update NiFi password after Tekton deploys NiFi
# (pipeline/setup.sh injects the real password via TEAM_PASSWORD at deploy time)
apiVersion: v1
kind: Secret
metadata:
  name: team-shared-credentials
  namespace: ${TEAM_NAMESPACE_PREFIX}-${TEAM_ID}
type: Opaque
stringData:
  nifi-password: "changeme"
