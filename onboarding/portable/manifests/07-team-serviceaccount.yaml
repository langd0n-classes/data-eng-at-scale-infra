# onboarding/portable/manifests/07-team-serviceaccount.yaml — ServiceAccount per team namespace
#
# New in the portable path: issue #57 (item 6) names ServiceAccount
# explicitly among the resources to provide. This repo has no existing
# per-team ServiceAccount to mirror (pipeline/rbac/01-serviceaccount.yaml is
# a different, unrelated concern — the OpenShift-Pipelines-SCC-bound
# "pipeline" SA). One dedicated ServiceAccount per team namespace, which
# that team's Tekton PipelineRun runs as (see pipeline/portable/), scoped by
# RBAC to only its own namespace.
#
# Usage (single team, manual):
#   source onboarding/portable/cluster.env && \
#   export TEAM_ID=01 && \
#   envsubst '${TEAM_NAMESPACE_PREFIX} ${TEAM_ID}' < onboarding/portable/manifests/07-team-serviceaccount.yaml | kubectl apply -f -
#
# Called by: onboarding/portable/apply-onboarding.sh
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-workload
  namespace: ${TEAM_NAMESPACE_PREFIX}-${TEAM_ID}
  labels:
    app: data-eng-infra
    team: team-${TEAM_ID}
