# onboarding/portable/manifests/04-team-namespace.yaml — Team namespace
#
# kubectl-only equivalent of onboarding/02-team-namespace.yaml. Apply once
# per team via the loop in apply-onboarding.sh, which sets TEAM_ID to 01, 02,
# 03, etc.
#
# Usage (single team, manual):
#   source onboarding/portable/cluster.env && \
#   export TEAM_ID=01 && \
#   envsubst '${TEAM_NAMESPACE_PREFIX} ${TEAM_ID}' < onboarding/portable/manifests/04-team-namespace.yaml | kubectl apply -f -
#
# Called by: onboarding/portable/apply-onboarding.sh
# Required vars: TEAM_NAMESPACE_PREFIX, TEAM_ID (e.g. "01", "02")
apiVersion: v1
kind: Namespace
metadata:
  name: ${TEAM_NAMESPACE_PREFIX}-${TEAM_ID}
  labels:
    app: data-eng-infra
    team: team-${TEAM_ID}
