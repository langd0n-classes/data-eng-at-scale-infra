# onboarding/portable/manifests/04-team-namespace.yaml — Team namespace
#
# kubectl-only equivalent of onboarding/02-team-namespace.yaml. Apply once
# per team via the loop in apply-onboarding.sh, which sets TEAM_ID to 01, 02,
# 03, etc.
#
# Usage (single team, manual):
#   source onboarding/portable/cluster.env && \
#   export TEAM_ID=01 && \
#   envsubst '${TEAM_NAMESPACE_PREFIX} ${TEAM_ID}' < onboarding/portable/manifests/04-team-namespace.yaml | kubectl apply -f -
#
# Called by: onboarding/portable/apply-onboarding.sh
# Required vars: TEAM_NAMESPACE_PREFIX, TEAM_ID (e.g. "01", "02")
apiVersion: v1
kind: Namespace
metadata:
  name: ${TEAM_NAMESPACE_PREFIX}-${TEAM_ID}
  labels:
    app: data-eng-infra
    team: team-${TEAM_ID}
    # Pod Security Admission: baseline is the real floor (blocks
    # privileged/hostPath/hostNetwork pods — edit RBAC alone doesn't).
    # restricted was tried first and confirmed live to reject Kafka
    # (Strimzi's broker pod never reached Ready) and even a plain
    # nginx/busybox pod with no securityContext set, so it's used here
    # only as warn/audit — visible in the API response/audit log for any
    # future pod that would violate it, without blocking anything that
    # actually needs to run today.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.34
