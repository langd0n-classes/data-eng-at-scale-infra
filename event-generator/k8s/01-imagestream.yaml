# Event Generator ImageStream
# Tracks the event generator container image in OpenShift's internal registry
# Deploy with: envsubst < imagestream.yaml | oc apply -f -

apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ${EVENT_GENERATOR_NAME}
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: ${EVENT_GENERATOR_NAME}
    app.kubernetes.io/name: ${EVENT_GENERATOR_NAME}
    app.kubernetes.io/component: data-producer
    app.kubernetes.io/part-of: data-engineering-platform
    app.kubernetes.io/managed-by: openshift
spec:
  lookupPolicy:
    local: true
