# event-generator/portable/k8s/deployment.yaml
#
# kubectl-only equivalent of event-generator/k8s/04-deployment.yaml — a
# plain Deployment pulling a pre-built image from the in-cluster registry
# (registry/portable/), no ImageStream/BuildConfig and no
# `image.openshift.io/triggers` annotation. The image itself is built and
# pushed by pipeline/portable/tasks/build-push-image-task.yaml.
#
# ${EVENT_GENERATOR_IMAGE} must be the exact reference the build Task
# pushed to, e.g. localhost:${REGISTRY_NODE_PORT}/${EVENT_GENERATOR_NAME}:latest
# — see registry/portable/README.md for why it's `localhost:<nodePort>`
# rather than the registry Service's cluster-DNS name.
#
# event_generator.py and check_events.py need no changes at all — both are
# already fully portable (env-var driven, no OpenShift API calls anywhere
# in the application code).
#
# Deploy with: envsubst < deployment.yaml | kubectl apply -f -

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${EVENT_GENERATOR_NAME}
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: ${EVENT_GENERATOR_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${EVENT_GENERATOR_NAME}
  template:
    metadata:
      labels:
        app: ${EVENT_GENERATOR_NAME}
    spec:
      containers:
        - name: generator
          image: ${EVENT_GENERATOR_IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ${EVENT_GENERATOR_NAME}-config
          resources:
            requests:
              memory: 768Mi
              cpu: 200m
            limits:
              memory: 2Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ${EVENT_GENERATOR_NAME}
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: ${EVENT_GENERATOR_NAME}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: ${EVENT_GENERATOR_NAME}
