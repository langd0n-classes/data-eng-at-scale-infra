# event-generator/portable/k8s/deployment.yaml
#
# kubectl-only equivalent of event-generator/k8s/04-deployment.yaml — a
# plain Deployment pulling a pre-built private image from GHCR, no
# ImageStream/BuildConfig and no `image.openshift.io/triggers` annotation.
# The image itself is built and pushed by
# .github/workflows/build-event-generator.yml on every commit touching
# event-generator/, not by anything in this cluster.
#
# ${EVENT_GENERATOR_IMAGE} is ghcr.io/langd0n-classes/event-generator:latest
# (see config.env.example) — private, so the Deployment also needs
# imagePullSecrets pointing at the one ghcr-pull-secret credential in
# infra (see portable/README.md's "Before you start" for how to create
# it).
#
# event_generator.py and check_events.py need no changes at all — both are
# already fully portable (env-var driven, no OpenShift API calls anywhere
# in the application code).
#
# Deploy with: envsubst < deployment.yaml | kubectl apply -f -

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${EVENT_GENERATOR_NAME}
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: ${EVENT_GENERATOR_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${EVENT_GENERATOR_NAME}
  template:
    metadata:
      labels:
        app: ${EVENT_GENERATOR_NAME}
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: generator
          image: ${EVENT_GENERATOR_IMAGE}
          # Always, not IfNotPresent: the image tag is always :latest, so the
          # node would otherwise reuse whatever it last pulled under that
          # exact name/tag and silently skip newer pushes to the same tag —
          # confirmed directly: a rebuilt+repushed image was not re-pulled
          # after a rollout restart until this was changed to Always.
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ${EVENT_GENERATOR_NAME}-config
          resources:
            requests:
              memory: 768Mi
              cpu: 200m
            limits:
              memory: 2Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ${EVENT_GENERATOR_NAME}
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: ${EVENT_GENERATOR_NAME}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: ${EVENT_GENERATOR_NAME}
