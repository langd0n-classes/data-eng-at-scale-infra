# event-generator/portable/k8s/configmap.yaml
#
# Identical to event-generator/k8s/03-configmap.yaml — nothing here is
# OpenShift-specific, so it's reused unmodified rather than duplicated with
# drift risk. Kept as its own copy (not a symlink) since portable/ is meant
# to be usable standalone, the same way kafka/portable/ doesn't reach back
# into kafka/operator/ for anything.
#
# Deploy with: envsubst < configmap.yaml | kubectl apply -f -

apiVersion: v1
kind: ConfigMap
metadata:
  name: ${EVENT_GENERATOR_NAME}-config
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: ${EVENT_GENERATOR_NAME}
data:
  # Event generation rate (events per second across all teams)
  EVENT_RATE_PER_SEC: "${EVENT_RATE_PER_SEC}"

  # Topic naming pattern:
  # Multi-team:   ${TOPIC_PREFIX}${TEAM_ID}${TOPIC_SUFFIX} (e.g., events.team01.raw)
  # Single-cluster: ${TOPIC_PREFIX}${TOPIC_SUFFIX} (e.g., events.raw) OR set TOPIC explicitly
  TOPIC_PREFIX: "${TOPIC_PREFIX}"
  TOPIC_SUFFIX: "${TOPIC_SUFFIX}"
  # Optional explicit topic name (overrides prefix/suffix for single-cluster mode)
  TOPIC: "${TOPIC}"

  # Geographic regions for simulation (comma-separated)
  REGIONS: "${REGIONS}"

  # Multi-team mode: team-to-Kafka bootstrap server mapping
  # Format: team_id=bootstrap_server,team_id=bootstrap_server,...
  # Dynamically generated at deployment time from config.env
  TEAM_BOOTSTRAP_SERVERS: "${TEAM_BOOTSTRAP_SERVERS}"

  # Single-cluster mode: Single shared Kafka cluster
  # Set in config.env to use single-cluster mode instead of multi-team
  KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"

  # Optional, not templated (the deploy scripts substitute a fixed variable list).
  # Add by hand to change the defaults, then restart the Deployment:
  #   LABEL_DELAY_HOURS: "12"          # hours after an hour ends before its labels are released
  #   LABEL_STATE_TEAM: "team00"       # team whose Kafka holds the staff-only staff.outbreak_state topic
  # Scheduled behaviors, off unless the start time is set (see event-generator/README.md).
  # A start time that does not parse stops the generator at startup:
  #   SCHEDULE_SEED: "551"                 # seed of every scheduled choice
  #   FALSE_ALARM_START: ""                # UTC ISO time; e.g. 2026-10-26T00:00:00Z
  #   FALSE_ALARM_PROBABILITY: "0.04"      # chance that a burst starts in a UTC hour
  #   FALSE_ALARM_MINUTES: "15"            # maximum burst length (bursts start HH:31-HH:45 and end by the end of the hour)
  #   FALSE_ALARM_EVENTS_PER_MINUTE: "6"   # extra symptom_report events per minute in the burst region
  #   AI_LABELS_START: ""                  # UTC ISO time; e.g. 2026-10-29T00:00:00Z
  #   AI_LABEL_DELAY_HOURS: "1"            # AI status released this long after the hour ends
  #   AI_LABEL_ERROR_RATE: "0.12"          # share of AI statuses that are wrong
  #   STAFF_CORRECTION_DELAY_HOURS: "18"   # staff correction this long after the AI status
