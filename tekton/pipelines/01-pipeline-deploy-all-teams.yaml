      description: |
        Bootstrap servers for ALL teams being deployed, comma-separated.
        Example: team01=kafka-team01.team-01.svc.cluster.local:9092,team02=...
      type: string
    - name: event-rate-per-sec
      type: string
      default: "10"
    - name: topic-prefix
      type: string
      default: "events."
    - name: topic-suffix
      type: string
      default: ".raw"
    - name: regions
      type: string
      default: "Boston,NYC,Chicago,Seattle,Austin"

  workspaces:
    - name: shared-data

  tasks:
    # ── Clone repo once — all tasks read templates from this workspace ────────
    - name: clone-repo
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-data

    # ── Deploy Kafka — one task per team, skipped if team-name == "skip" ──────
    - name: deploy-kafka-team1
      runAfter: [clone-repo]
      when:
        - input: "$(params.team1-name)"
          operator: notin
          values: ["skip"]
      taskRef:
        name: deploy-kafka
      params:
        - name: team-name
          value: $(params.team1-name)
        - name: team-namespace
          value: $(params.team1-namespace)
        - name: storage-class
          value: $(params.storage-class)
      workspaces:
        - name: source
