# Pipeline: deploy-all-teams
#
# Deploys Kafka + NiFi for up to 15 teams in parallel, then updates the event
# generator once with all bootstrap servers.
#
# Per team: deploy-kafka-teamN → deploy-nifi-teamN (chained, maximises parallelism)
# Teams set to "skip" in config.env are automatically bypassed via Tekton
# `when` expressions. The event generator always runs once at the end.
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE}' \
#     < tekton/pipelines/01-pipeline-deploy-all-teams.yaml | oc apply -f -

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: deploy-all-teams
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: tekton-pipeline
spec:
  description: |
    Deploys Kafka + NiFi for up to 15 teams, then updates the event generator
    once with all bootstrap servers. Teams set to "skip" are bypassed automatically.
    Per team: deploy-kafka → deploy-nifi (chained per team, parallel across teams).

  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: storage-class
      type: string
      default: standard
    # infra-namespace removed — derived automatically via $(context.pipelineRun.namespace)
    - name: event-generator-name
      type: string
      default: event-generator
    # ── Teams 1-15 (set to "skip" in config.env to bypass) ───────────────────
    - name: team1-name
      type: string
      default: skip
    - name: team1-namespace
      type: string
      default: skip

    - name: team2-name
      type: string
      default: skip
    - name: team2-namespace
      type: string
      default: skip

    - name: team3-name
      type: string
      default: skip
    - name: team3-namespace
      type: string
      default: skip

    - name: team4-name
      type: string
      default: skip
