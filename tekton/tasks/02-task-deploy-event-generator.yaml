# Task: deploy-event-generator
#
# Deploys or updates the event generator in the infra namespace.
# Applies all 4 k8s resource files in order:
#   1. ImageStream (OpenShift image registry entry)
#   2. BuildConfig (builds the Docker image from Git source)
#   3. ConfigMap  (runtime config: Kafka addresses, event rate, topics prefix, etc.)
#   4. Deployment (runs the Python event generator)
#
# Then restarts the deployment so it picks up any ConfigMap changes immediately.
#
# Build idempotency: the wait-for-build step compares the workspace git commit SHA
# against the SHA recorded in the latest Complete build. If they match, the build is
# skipped — the image is already up-to-date. If the commit has changed (or the last
# build failed), a new build is triggered via oc start-build.
#
# This Task is idempotent — running it again updates config without recreating resources.
#
# Note on topics: KAFKA_AUTO_CREATE_TOPICS_ENABLE=true is set on the Kafka broker,
# so topics are auto-created when the event generator first produces a message.
# No separate topic creation step is needed.
#
# Variables substituted via envsubst (source config.env first):
#   ${INFRA_NAMESPACE}  — config.env: INFRA_NAMESPACE  (namespace this Task lives in)
#   ${OC_CLI_IMAGE}     — config.env: OC_CLI_IMAGE     (OpenShift CLI image for task steps)
#
# NOTE: use scoped envsubst to avoid substituting bash ${VAR} inside the scripts:
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE} ${OC_CLI_IMAGE}' \
#     < tekton/tasks/02-task-deploy-event-generator.yaml | oc apply -f -

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-event-generator
  namespace: ${INFRA_NAMESPACE}  # config.env: INFRA_NAMESPACE
  labels:
    app: tekton-pipeline
    component: event-generator
spec:
  description: |
    Deploys or updates the event generator in the infra namespace.
    Applies ImageStream, BuildConfig, ConfigMap, and Deployment.
    Restarts the deployment to pick up config changes.

  params:
    - name: infra-namespace
      description: "Namespace where event generator runs (usually: infra)"
      type: string
      default: infra

    - name: event-generator-name
      description: "Name of the event generator deployment"
      type: string
      default: event-generator

    - name: git-repo-url
      description: "Git URL for OpenShift to build the event generator image from"
      type: string

    - name: git-branch
      description: "Git branch to build from"
      type: string
      default: main

    - name: team-bootstrap-servers
      description: |
        Team-to-Kafka mapping for multi-team mode.
        Format: team01=kafka-team01.team-01.svc.cluster.local:9092
        Multiple teams: team01=kafka-...:9092,team02=kafka-...:9092
      type: string

    - name: event-rate-per-sec
      description: "Events to generate per second"
      type: string
      default: "10"

    - name: topic-prefix
      description: "Prefix for auto-named topics (e.g., events.)"
      type: string
      default: "events."

    - name: topic-suffix
      description: "Suffix for auto-named topics (e.g., .raw)"
      type: string
      default: ".raw"

    - name: regions
      description: "Comma-separated geographic regions for simulation"
      type: string
      default: "Boston,NYC,Chicago,Seattle,Austin"

  workspaces:
    - name: source
      description: "Git repository containing event-generator/k8s/ files"

  steps:
    # Step 1: Apply ImageStream and BuildConfig
    # ImageStream: registers the image in OpenShift's internal registry
    # BuildConfig: tells OpenShift how to build the image from Git source
    - name: apply-build-resources
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        EG_NAME="$(params.event-generator-name)"
        SOURCE="$(workspaces.source.path)/event-generator/k8s"
        DOLLAR='$'

        echo "=================================================="
        echo "Applying ImageStream..."
        echo "=================================================="
        sed \
          -e "s|${DOLLAR}{INFRA_NAMESPACE}|${INFRA_NS}|g" \
          -e "s|${DOLLAR}{EVENT_GENERATOR_NAME}|${EG_NAME}|g" \
          "${SOURCE}/01-imagestream.yaml" | oc apply -f -

        echo ""
        echo "=================================================="
        echo "Applying BuildConfig (builds image from Git)..."
        echo "=================================================="
        sed \
          -e "s|${DOLLAR}{INFRA_NAMESPACE}|${INFRA_NS}|g" \
          -e "s|${DOLLAR}{EVENT_GENERATOR_NAME}|${EG_NAME}|g" \
          -e "s|${DOLLAR}{GIT_REPO_URL}|$(params.git-repo-url)|g" \
          -e "s|${DOLLAR}{GIT_BRANCH}|$(params.git-branch)|g" \
          "${SOURCE}/02-buildconfig.yaml" | oc apply -f -

        echo ""
        echo "Build resources applied."

    # Step 2: Start image build if needed, then wait for it to complete.
    #
    # Idempotency via git SHA comparison:
    #   - If the latest Complete build was already built from the current workspace
    #     commit, skip the build — the image is already up-to-date.
    #   - If the commit has changed (or the last build failed/was cancelled),
    #     trigger a new build with oc start-build --follow.
    #
    # This avoids both problems with the ConfigChange-trigger approach:
    #   1. Stale builds from prior runs are no longer reused (different SHA → rebuild).
    #   2. Re-running the pipeline on the same commit does not waste a redundant build.
    - name: wait-for-build
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        EG_NAME="$(params.event-generator-name)"
        WORKSPACE="$(workspaces.source.path)"

        echo "=================================================="
        echo "Checking whether a new image build is needed..."
        echo "=================================================="

        # Resolve the current workspace commit SHA.
        # Tekton git-clone checks out in detached-HEAD mode so .git/HEAD
        # contains the 40-char SHA directly (no symbolic ref to follow).
        # Use git if available; fall back to reading .git/HEAD directly.
        if command -v git &>/dev/null; then
          CURRENT_SHA=$(git -C "${WORKSPACE}" rev-parse HEAD 2>/dev/null || echo "")
        else
          CURRENT_SHA=$(cat "${WORKSPACE}/.git/HEAD" 2>/dev/null \
            | grep -E '^[0-9a-f]{40}$' || echo "")
        fi
        echo "Workspace commit: ${CURRENT_SHA:-unknown}"

        # Find the latest build for this BuildConfig
        BUILD_NAME=$(oc get builds -n "${INFRA_NS}" -l "buildconfig=${EG_NAME}" \
          --sort-by='.metadata.creationTimestamp' \
          -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")

        if [ -n "$BUILD_NAME" ] && [ -n "$CURRENT_SHA" ]; then
          LAST_SHA=$(oc get build "${BUILD_NAME}" -n "${INFRA_NS}" \
            -o jsonpath='{.spec.revision.git.commit}' 2>/dev/null || echo "")
          LAST_PHASE=$(oc get build "${BUILD_NAME}" -n "${INFRA_NS}" \
            -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")

          echo "Latest build:   ${BUILD_NAME}"
          echo "  phase:        ${LAST_PHASE}"
          echo "  built commit: ${LAST_SHA:-not yet recorded}"

          if [ "${LAST_SHA}" = "${CURRENT_SHA}" ] && [ "${LAST_PHASE}" = "Complete" ]; then
            echo ""
            echo "Image is already up-to-date for commit ${CURRENT_SHA}."
            echo "Skipping build — no changes since last successful build."
            echo ""
            echo "Image build complete. ImageStream updated."
            exit 0
          fi

          echo ""
          if [ "${LAST_SHA}" != "${CURRENT_SHA}" ]; then
            echo "Commit changed (${LAST_SHA:-none} → ${CURRENT_SHA}) — starting new build."
          else
            echo "Last build phase is '${LAST_PHASE}' (not Complete) — starting new build."
          fi
        else
          echo "No previous build found — starting first build."
        fi

        echo ""
        echo "=================================================="
        echo "Starting image build: ${EG_NAME}"
        echo "=================================================="
        # --follow streams build logs to Tekton and blocks until the build finishes.
        # If the build fails, oc start-build exits non-zero and the pipeline stops.
        oc start-build "${EG_NAME}" -n "${INFRA_NS}" --follow

        # Verify the build completed successfully
        echo ""
        echo "Verifying build result..."
        BUILD_NAME=$(oc get builds -n "${INFRA_NS}" -l "buildconfig=${EG_NAME}" \
          --sort-by='.metadata.creationTimestamp' \
          -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || echo "")

        if [ -z "$BUILD_NAME" ]; then
          echo "ERROR: Could not find build after oc start-build."
          exit 1
        fi

        PHASE=$(oc get build "${BUILD_NAME}" -n "${INFRA_NS}" \
          -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
        if [ "$PHASE" != "Complete" ]; then
          echo "ERROR: Build ${BUILD_NAME} ended with phase: ${PHASE}"
          exit 1
        fi

        echo ""
        echo "Image build complete. ImageStream updated."

    # Step 3: Apply ConfigMap with current runtime configuration
    # This is what controls event rate, topic names, Kafka addresses, etc.
    # Changing any param and re-running the pipeline updates this ConfigMap.
    - name: apply-configmap
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        EG_NAME="$(params.event-generator-name)"
        SOURCE="$(workspaces.source.path)/event-generator/k8s"
        DOLLAR='$'

        echo "=================================================="
        echo "Applying ConfigMap with current configuration..."
        echo "  team-bootstrap-servers: $(params.team-bootstrap-servers)"
        echo "  event-rate-per-sec:     $(params.event-rate-per-sec)"
        echo "  topic-prefix:           $(params.topic-prefix)"
        echo "  topic-suffix:           $(params.topic-suffix)"
        echo "=================================================="

        # Substitute all template variables using sed
        # Using | as delimiter to avoid issues with / in URLs/paths
        sed \
          -e "s|${DOLLAR}{INFRA_NAMESPACE}|${INFRA_NS}|g" \
          -e "s|${DOLLAR}{EVENT_GENERATOR_NAME}|${EG_NAME}|g" \
          -e "s|${DOLLAR}{TEAM_BOOTSTRAP_SERVERS}|$(params.team-bootstrap-servers)|g" \
          -e "s|\${EVENT_RATE_PER_SEC}|$(params.event-rate-per-sec)|g" \
          -e "s|\${TOPIC_PREFIX}|$(params.topic-prefix)|g" \
          -e "s|\${TOPIC_SUFFIX}|$(params.topic-suffix)|g" \
          -e "s|\${REGIONS}|$(params.regions)|g" \
          -e "s|\${TOPIC}||g" \
          -e "s|\${KAFKA_BOOTSTRAP_SERVERS}||g" \
          "${SOURCE}/03-configmap.yaml" | oc apply -f -

        echo ""
        echo "ConfigMap applied."

    # Step 3: Apply Deployment and restart to pick up ConfigMap changes
    - name: apply-deployment
      image: ${OC_CLI_IMAGE}  # config.env: OC_CLI_IMAGE
      computeResources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"
      script: |
        #!/bin/bash
        set -e

        INFRA_NS="$(params.infra-namespace)"
        EG_NAME="$(params.event-generator-name)"
        SOURCE="$(workspaces.source.path)/event-generator/k8s"
        DOLLAR='$'

        echo "=================================================="
        echo "Applying Deployment..."
        echo "=================================================="
        sed \
          -e "s|${DOLLAR}{INFRA_NAMESPACE}|${INFRA_NS}|g" \
          -e "s|${DOLLAR}{EVENT_GENERATOR_NAME}|${EG_NAME}|g" \
          "${SOURCE}/04-deployment.yaml" | oc apply -f -

        echo ""
        echo "Restarting deployment to pick up ConfigMap changes..."
        # rollout restart creates a new pod with the updated config
        # '|| true' prevents failure if the deployment doesn't exist yet
        # (first run: deployment was just created, no need to restart)
        oc rollout restart "deployment/${EG_NAME}" -n "${INFRA_NS}" 2>/dev/null || true

        echo ""
        echo "Waiting for deployment rollout to complete..."
        oc rollout status "deployment/${EG_NAME}" -n "${INFRA_NS}" --timeout=300s

        echo ""
        echo "Event generator deployment is ready."
