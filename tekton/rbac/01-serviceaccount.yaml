# ServiceAccount for Tekton pipeline execution
#
# The pipeline runs all its Tasks as this ServiceAccount.
# It lives in the infra namespace but needs cross-namespace permissions
# (granted by ClusterRoleBinding in 02-clusterrolebinding.yaml).
#
# Variables substituted via envsubst (source config.env first):
#   ${INFRA_NAMESPACE}  — config.env: INFRA_NAMESPACE  (e.g. ds551-2026-spring-9ab13b)
#   ${TEKTON_SA_NAME}   — config.env: TEKTON_SA_NAME   (default: pipeline)
#
# Apply with:
#   source config.env && envsubst '${INFRA_NAMESPACE} ${TEKTON_SA_NAME}' \
#     < tekton/rbac/01-serviceaccount.yaml | oc apply -f -

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${TEKTON_SA_NAME}        # config.env: TEKTON_SA_NAME
  namespace: ${INFRA_NAMESPACE}  # config.env: INFRA_NAMESPACE
  labels:
    app: tekton-pipeline
    component: rbac
