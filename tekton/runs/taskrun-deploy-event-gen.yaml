# TaskRun: deploy-event-generator (initial deploy)
#
# Deploys or updates the event generator as a standalone operation,
# outside of a pipeline. Applies ConfigMap and Deployment, then restarts
# the deployment to pick up config changes.
#
# Prerequisites:
#   - setup.sh has been run at least once (ImageStream + BuildConfig must exist)
#   - At least one PipelineRun has completed (workspace PVC must exist)
#   - TEKTON_WORKSPACE_PVC is set in config.env
#     Find it with: oc get pvc -n ${INFRA_NAMESPACE} | grep shared-data
#
# Apply with:
#   source config.env && \
#   envsubst '${INFRA_NAMESPACE} ${EVENT_GENERATOR_NAME} ${TEAM_BOOTSTRAP_SERVERS} ${EVENT_RATE_PER_SEC} ${TOPIC_PREFIX} ${TOPIC_SUFFIX} ${REGIONS} ${TEKTON_WORKSPACE_PVC}' \
#     < tekton/runs/taskrun-deploy-event-gen.yaml | oc create -f -
#
# Watch:
#   tkn taskrun logs --last -f -n ${INFRA_NAMESPACE}
#
# Variables (all from config.env):
#   ${INFRA_NAMESPACE}          — shared infra namespace
#   ${EVENT_GENERATOR_NAME}     — event generator deployment name
#   ${TEAM_BOOTSTRAP_SERVERS}   — full comma-separated team-to-Kafka mapping
#   ${EVENT_RATE_PER_SEC}       — events per second
#   ${TOPIC_PREFIX}             — topic name prefix (e.g. events.)
#   ${TOPIC_SUFFIX}             — topic name suffix (e.g. .raw)
#   ${REGIONS}                  — comma-separated regions for simulation
#   ${TEKTON_WORKSPACE_PVC}     — PVC name from a previous PipelineRun

apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: deploy-event-gen-             # auto-unique suffix, no collision
  namespace: ${INFRA_NAMESPACE}               # config.env: INFRA_NAMESPACE
  labels:
    app: tekton-pipeline
    component: event-generator
spec:
  taskRef:
    name: deploy-event-generator

  params:
    - name: infra-namespace
      value: "${INFRA_NAMESPACE}"             # config.env: INFRA_NAMESPACE

    - name: event-generator-name
      value: "${EVENT_GENERATOR_NAME}"        # config.env: EVENT_GENERATOR_NAME

    - name: team-bootstrap-servers
      value: "${TEAM_BOOTSTRAP_SERVERS}"     # config.env: TEAM_BOOTSTRAP_SERVERS

    - name: event-rate-per-sec
      value: "${EVENT_RATE_PER_SEC}"         # config.env: EVENT_RATE_PER_SEC

    - name: topic-prefix
      value: "${TOPIC_PREFIX}"               # config.env: TOPIC_PREFIX

    - name: topic-suffix
      value: "${TOPIC_SUFFIX}"               # config.env: TOPIC_SUFFIX

    - name: regions
      value: "${REGIONS}"                    # config.env: REGIONS

  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: "${TEKTON_WORKSPACE_PVC}"  # config.env: TEKTON_WORKSPACE_PVC
