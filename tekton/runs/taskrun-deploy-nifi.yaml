# TaskRun: deploy-nifi
#
# Deploys NiFi for a single team using the existing workspace PVC.
# No git clone — reuses the PVC left behind by the last PipelineRun.
#
# When to use:
#   - Adding a new team's NiFi after initial Kafka deploy
#   - Redeploying a crashed team's NiFi (templates unchanged)
#
# Prerequisites:
#   - At least one PipelineRun has completed (workspace PVC must exist)
#   - TEKTON_WORKSPACE_PVC is set in config.env
#     Find it with: oc get pvc -n ${INFRA_NAMESPACE} | grep shared-data
#
# Apply with:
#   source config.env && \
#   envsubst '${TEAM_NAME} ${TEAM_NAMESPACE} ${INFRA_NAMESPACE} ${NIFI_IMAGE} ${TEAM_PASSWORD} ${STORAGE_CLASS} ${EXTERNAL_DOMAIN} ${TEKTON_WORKSPACE_PVC}' \
#     < tekton/runs/taskrun-deploy-nifi.yaml | oc create -f -
#
# Watch:
#   tkn taskrun logs --last -f -n ${INFRA_NAMESPACE}
#
# Variables (all from config.env):
#   ${TEAM_NAME}              — team identifier used in resource names    (e.g. team01)
#   ${TEAM_NAMESPACE}         — OpenShift namespace for this team         (e.g. team-01)
#   ${INFRA_NAMESPACE}        — shared infra namespace                    (e.g. infra)
#   ${NIFI_IMAGE}             — NiFi container image
#   ${TEAM_PASSWORD}          — NiFi single-user login password for this team
#   ${STORAGE_CLASS}          — PVC storage class for NiFi               (e.g. standard)
#   ${EXTERNAL_DOMAIN}        — OpenShift wildcard domain
#   ${TEKTON_WORKSPACE_PVC}   — PVC name from a previous PipelineRun

apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: deploy-nifi-${TEAM_NAME}-    # auto-unique suffix, no collision
  namespace: ${INFRA_NAMESPACE}              # config.env: INFRA_NAMESPACE
  labels:
    app: tekton-pipeline
    component: nifi
    team: ${TEAM_NAME}
spec:
  taskRef:
    name: deploy-nifi

  params:
    - name: team-name
      value: "${TEAM_NAME}"                  # config.env: TEAM_NAME

    - name: team-namespace
      value: "${TEAM_NAMESPACE}"             # config.env: TEAM_NAMESPACE

    - name: nifi-image
      value: "${NIFI_IMAGE}"                 # config.env: NIFI_IMAGE

    - name: team-password
      value: "${TEAM_PASSWORD}"              # config.env: TEAM_PASSWORD

    - name: storage-class
      value: "${STORAGE_CLASS}"              # config.env: STORAGE_CLASS

    - name: external-domain
      value: "${EXTERNAL_DOMAIN}"            # config.env: EXTERNAL_DOMAIN

  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: "${TEKTON_WORKSPACE_PVC}" # config.env: TEKTON_WORKSPACE_PVC
