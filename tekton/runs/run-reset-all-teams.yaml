# PipelineRun: reset-and-deploy all teams
#
# Tears down all Kafka and the event generator, then redeploys everything fresh.
# Use this after config changes, broken deployments, or a full classroom reset.
#
# All values come from config.env — source it first, then run:
#
#   source config.env && envsubst < tekton/runs/run-reset-all-teams.yaml | oc create -f -
#   tkn pipelinerun logs --last -f -n ${INFRA_NAMESPACE}
#
# HOW TO USE:
#   1. Set TEAM1_NAME/NAMESPACE through TEAM15_NAME/NAMESPACE in config.env (unused = "skip").
#   2. Update TEAM_BOOTSTRAP_SERVERS to list all active teams.
#   3. Run the command above.
#
# IMPORTANT: Change the run name suffix (run-001 → run-002) on each new execution.
#
# Variables used (all from config.env):
#   ${INFRA_NAMESPACE}           — shared infra namespace
#   ${GIT_REPO_URL}              — your forked repo URL
#   ${GIT_BRANCH}                — branch to deploy from
#   ${STORAGE_CLASS}             — PVC storage class for Kafka
#   ${EVENT_GENERATOR_NAME}      — event generator deployment name
#   serviceAccountName           — hardcoded as "pipeline" (default OpenShift Pipelines SA)
#   ${TEKTON_WORKSPACE_SIZE}     — shared workspace PVC size
#   ${TEAM_BOOTSTRAP_SERVERS}    — all Kafka addresses comma-separated
#   ${TEAM1_NAME} / ${TEAM1_NAMESPACE}   — team 1 (set to "skip" to bypass)
#   ...
#   ${TEAM15_NAME} / ${TEAM15_NAMESPACE} — team 15

apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: reset-all-teams-run-001        # change suffix for each new run
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: tekton-pipeline
spec:
  serviceAccountName: pipeline  # default SA created by OpenShift Pipelines in every namespace

  pipelineRef:
    name: reset-and-deploy

  params:
    # ── Git source ──────────────────────────────────────────────────────────
    - name: git-url
      value: ${GIT_REPO_URL}

    - name: git-revision
      value: ${GIT_BRANCH}

    - name: storage-class
      value: ${STORAGE_CLASS}

    # ── Infra namespace is derived automatically from $(context.pipelineRun.namespace)
    # No need to pass infra-namespace — the pipeline derives it from context.

    - name: event-generator-name
      value: ${EVENT_GENERATOR_NAME}

    - name: git-repo-url
      value: ${GIT_REPO_URL}

    # ── Teams 1-15 (set to "skip" in config.env to bypass) ──────────────────
    - name: team1-name
      value: ${TEAM1_NAME}
    - name: team1-namespace
      value: ${TEAM1_NAMESPACE}

    - name: team2-name
      value: ${TEAM2_NAME}
    - name: team2-namespace
      value: ${TEAM2_NAMESPACE}

    - name: team3-name
      value: ${TEAM3_NAME}
    - name: team3-namespace
      value: ${TEAM3_NAMESPACE}

    - name: team4-name
      value: ${TEAM4_NAME}
    - name: team4-namespace
      value: ${TEAM4_NAMESPACE}

    - name: team5-name
      value: ${TEAM5_NAME}
    - name: team5-namespace
      value: ${TEAM5_NAMESPACE}

    - name: team6-name
      value: ${TEAM6_NAME}
    - name: team6-namespace
      value: ${TEAM6_NAMESPACE}

    - name: team7-name
      value: ${TEAM7_NAME}
    - name: team7-namespace
      value: ${TEAM7_NAMESPACE}

    - name: team8-name
      value: ${TEAM8_NAME}
    - name: team8-namespace
      value: ${TEAM8_NAMESPACE}

    - name: team9-name
      value: ${TEAM9_NAME}
    - name: team9-namespace
      value: ${TEAM9_NAMESPACE}

    - name: team10-name
      value: ${TEAM10_NAME}
    - name: team10-namespace
      value: ${TEAM10_NAMESPACE}

    - name: team11-name
      value: ${TEAM11_NAME}
    - name: team11-namespace
      value: ${TEAM11_NAMESPACE}

    - name: team12-name
      value: ${TEAM12_NAME}
    - name: team12-namespace
      value: ${TEAM12_NAMESPACE}

    - name: team13-name
      value: ${TEAM13_NAME}
    - name: team13-namespace
      value: ${TEAM13_NAMESPACE}

    - name: team14-name
      value: ${TEAM14_NAME}
    - name: team14-namespace
      value: ${TEAM14_NAMESPACE}

    - name: team15-name
      value: ${TEAM15_NAME}
    - name: team15-namespace
      value: ${TEAM15_NAMESPACE}

    # ── Event generator config ───────────────────────────────────────────────
    - name: all-team-bootstrap-servers
      value: "${TEAM_BOOTSTRAP_SERVERS}"

    - name: event-rate-per-sec
      value: "${EVENT_RATE_PER_SEC}"

    - name: topic-prefix
      value: "${TOPIC_PREFIX}"

    - name: topic-suffix
      value: "${TOPIC_SUFFIX}"

    - name: event-streams
      value: "${EVENT_STREAMS}"

    - name: regions
      value: "${REGIONS}"

  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: ${TEKTON_WORKSPACE_SIZE}
