# Enables OpenShift User Workload Monitoring (UWM).
#
# When applied, the cluster monitoring operator starts a dedicated Prometheus
# instance in openshift-user-workload-monitoring that scrapes PodMonitors and
# ServiceMonitors in user namespaces.  Grafana talks to this Prometheus via
# thanos-querier at https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
#
# Applied once by pipeline/setup.sh (developer user with cluster-admin is sufficient —
# no kubeadmin required).  Safe to re-apply (idempotent).
#
# Verify after apply (allow 2-3 min for pods to start):
#   oc get pods -n openshift-user-workload-monitoring

apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true
