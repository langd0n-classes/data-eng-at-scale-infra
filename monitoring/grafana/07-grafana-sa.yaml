# Grafana ServiceAccount and long-lived token Secret.
#
# grafana-sa is deliberately separate from the Tekton pipeline-runner SA:
#   - pipeline-runner has broad cluster powers (create/delete pods, CRs, PVCs)
#   - grafana-sa needs only cluster-monitoring-view (read metrics from thanos-querier)
# Least privilege: grafana-sa cannot deploy, scale, or delete anything.
#
# The Secret type kubernetes.io/service-account-token causes the token controller
# to populate .data.token automatically.  Task 08 waits for the token to appear
# before building the Grafana datasource ConfigMap.
#
# Variables: ${INFRA_NAMESPACE}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-sa-token
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: grafana
  annotations:
    kubernetes.io/service-account.name: grafana-sa
type: kubernetes.io/service-account-token
