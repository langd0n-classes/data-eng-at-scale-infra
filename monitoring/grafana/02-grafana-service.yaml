# Grafana Service — exposes port 3000 for the Route to target.
#
# Variables: ${INFRA_NAMESPACE}

apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http-grafana
      port: 3000
      targetPort: 3000
      protocol: TCP
