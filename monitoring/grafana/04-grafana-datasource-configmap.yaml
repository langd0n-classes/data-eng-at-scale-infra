# Grafana datasource provisioning — connects Grafana to thanos-querier.
#
# TEMPLATE FILE: ${GRAFANA_SA_TOKEN} is substituted at deploy time by
# Tekton task 08 (step apply-grafana-datasource).  Never committed with a real
# token — the placeholder is intentional.
#
# thanos-querier aggregates metrics from both the cluster-level Prometheus and
# OpenShift User Workload Monitoring, making all team Kafka metrics available
# in a single query endpoint.
#
# Variables: ${INFRA_NAMESPACE}, ${GRAFANA_SA_TOKEN} (injected at deploy time)

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        access: proxy
        isDefault: true
        jsonData:
          tlsSkipVerify: true
          httpHeaderName1: "Authorization"
        secureJsonData:
          httpHeaderValue1: "Bearer ${GRAFANA_SA_TOKEN}"
