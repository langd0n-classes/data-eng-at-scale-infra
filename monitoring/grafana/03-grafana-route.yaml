# Grafana Route — edge TLS, instructor access only.
# Do NOT share this URL with students — dashboards show all team data.
#
# Variables: ${INFRA_NAMESPACE}

apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: grafana
spec:
  to:
    kind: Service
    name: grafana
  port:
    targetPort: http-grafana
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
