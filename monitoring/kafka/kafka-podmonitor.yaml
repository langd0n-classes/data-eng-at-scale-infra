# PodMonitor: scrapes JMX metrics from all Strimzi Kafka pods across every namespace.
#
# Lives in the infra namespace — all monitoring config is centralized here.
# Uses namespaceSelector: any: true so new team namespaces are picked up
# automatically without editing this file.
#
# The selector (strimzi.io/kind=Kafka) limits scraping to Kafka pods only —
# safe in a classroom cluster where the instructor controls all namespaces.
#
# Port name tcp-prometheus (port 9404) is the JMX exporter sidecar that Strimzi
# adds to the Kafka pod when metricsConfig is set on the Kafka CR.
#
# Applied once to infra namespace by Tekton task 08-task-deploy-grafana.yaml.
#
# Variables: ${INFRA_NAMESPACE}
#
# Apply with:
#   sed -e "s|\${INFRA_NAMESPACE}|infra|g" \
#     monitoring/kafka/kafka-podmonitor.yaml | oc apply -f -
#
# Verify (wait 2-3 min after apply for Prometheus to pick it up):
#   oc port-forward -n openshift-user-workload-monitoring pod/prometheus-user-workload-0 9090:9090
#   # Open http://localhost:9090/targets

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-all-teams-metrics
  namespace: ${INFRA_NAMESPACE}
  labels:
    app: kafka-monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      strimzi.io/kind: Kafka
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
      scheme: http
