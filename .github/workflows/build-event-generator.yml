name: Build and push event-generator

on:
  push:
    branches:
      - main
      - feature/portable-fall-platform
    paths:
      - event-generator/Dockerfile
      - event-generator/src/**

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: event-generator
          file: event-generator/Dockerfile
          push: true
          tags: |
            ghcr.io/langd0n-classes/event-generator:latest
            ghcr.io/langd0n-classes/event-generator:${{ github.sha }}
