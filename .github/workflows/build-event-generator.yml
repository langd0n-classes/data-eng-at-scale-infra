name: Build and push event-generator

on:
  push:
    branches:
      - main
      - feature/portable-fall-platform
    paths:
      - event-generator/Dockerfile
      - event-generator/src/**

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: event-generator
          file: event-generator/Dockerfile
          push: true
          tags: |
            ghcr.io/langd0n-classes/event-generator:latest
            ghcr.io/langd0n-classes/event-generator:${{ github.sha }}
