name: Build and push spark-queue-controller

on:
  push:
    branches:
      - main
      - feature/portable-fall-platform
    paths:
      - spark-queue/portable/Dockerfile
      - spark-queue/portable/requirements.txt
      - spark-queue/portable/scripts/queue-controller.py

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: spark-queue/portable
          file: spark-queue/portable/Dockerfile
          push: true
          tags: |
            ghcr.io/langd0n-classes/spark-queue-controller:latest
            ghcr.io/langd0n-classes/spark-queue-controller:${{ github.sha }}
